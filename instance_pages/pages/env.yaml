    }
    // Pill auto-hide parity with PageActionsPill: scroll / outside-tap
    // collapses to the toggle (never while typing in the pill filter),
    // idle 2.5s + hover restore. Document listeners bound once; the pill
    // node itself is re-queried every time (render() recreates it).
    function wirePillAutoHide() {
