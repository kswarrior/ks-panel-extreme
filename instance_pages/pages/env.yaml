# Env — instance page (YAML authoring format).
# Converted from env.json; edit this file, not JSON.
# Multiline content uses `|` literal blocks (raw HTML/JS, no escaping);
# actions/sub_pages/components/configure are native YAML lists.
# See instance_pages/README.md for the field reference.
name: Env
slug: env
kind: custom
category: configuration
type: env-editor
description: 'Environment variables for this instance: add, edit, import and save. Saving recreates the workload.'
content_type: html
content_html: |-
  {{component:ks_theme_head}}<div class="ks-page">
    <div id="root"><div class="ks-card"><div class="ks-skeleton-bar" style="height:12px;width:40%;margin-bottom:8px"></div><div class="ks-skeleton" style="height:12px;width:65%"></div></div></div>
  </div>
  <script>
  (function () {
    'use strict';
    var sdk = null;
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function toast(m, t) { try { sdk.toast(m, t || 'info'); } catch (e) {} }
    function ask(m) {
      try { if (sdk && typeof sdk.confirm === 'function') return sdk.confirm(m); } catch (e) {}
      return Promise.resolve(window.confirm(m));
    }
    function readOnly() {
      try {
        var c = window.KS_PAGE_CONFIG || {};
        return c.read_only === 'true' || c.read_only === '1' || c.read_only === 'on';
      } catch (e) { return false; }
    }
    var KEY_RE = /^[A-Za-z_][A-Za-z0-9_]*$/;
    var MAX_VARS = 200, MAX_KEY_LEN = 128, MAX_VALUE_LEN = 8000;
    function parseEnvMap(cfg) {
      var out = {};
      var raw = cfg && cfg.env;
      if (!raw) return out;
      if (typeof raw === 'object' && !Array.isArray(raw)) {
        for (var k in raw) {
          if (!Object.prototype.hasOwnProperty.call(raw, k) || k.trim() === '') continue;
          out[k] = String(raw[k] == null ? '' : raw[k]);
        }
        return out;
      }
      if (Array.isArray(raw)) {
        for (var i = 0; i < raw.length; i++) {
          var e = raw[i];
          if (!e || typeof e !== 'object' || Array.isArray(e)) continue;
          var key = String(e.name != null ? e.name : (e.key != null ? e.key : '')).trim();
          if (!key) continue;
          out[key] = String(e.default != null ? e.default : (e.value != null ? e.value : ''));
        }
      }
      return out;
    }
    function toRows(m) {
      return Object.keys(m).sort().map(function (k) { return { key: k, value: m[k] }; });
    }
    function toMap(rows) {
      var out = {};
      for (var i = 0; i < rows.length; i++) out[rows[i].key] = rows[i].value;
      return out;
    }
    function keyError(key, rows, ignoreIdx) {
      var k = String(key || '').trim();
      if (k === '') return 'Key is required.';
      if (k.length > MAX_KEY_LEN) return 'Key is too long (max ' + MAX_KEY_LEN + ').';
      if (!KEY_RE.test(k)) return 'Use only letters, numbers and _ — must start with a letter or _.';
      for (var i = 0; i < rows.length; i++) {
        if (i !== ignoreIdx && rows[i].key === k) return 'Duplicate key "' + k + '".';
      }
      return '';
    }
    function quoteEnvValue(v) {
      if (v === '') return '';
      if (/[\n\r]/.test(v) || /^\s|\s$/.test(v) || /[#"'`]/.test(v)) {
        return '"' + v.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r') + '"';
      }
      return v;
    }
    function unquoteEnvValue(v) {
      var t = String(v == null ? '' : v).trim();
      if (t.length >= 2 && ((t[0] === '"' && t[t.length - 1] === '"') || (t[0] === "'" && t[t.length - 1] === "'"))) {
        var inner = t.slice(1, -1);
        if (t[0] === '"') return inner.replace(/\\n/g, '\n').replace(/\\r/g, '\r').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
        return inner;
      }
      return String(v == null ? '' : v).trim();
    }

    var state = {
      rows: [], baseline: {}, filter: '', saving: false,
      saveError: '', savedNote: '', modal: null, touched: false,
      pillOff: false
    };
    function dirty() { return JSON.stringify(toMap(state.rows)) !== JSON.stringify(state.baseline); }
    function el(id) { return document.getElementById(id); }

    function load() {
      sdk.fetchPanel('').then(function (inst) {
        try {
          var m = parseEnvMap((inst && inst.config) || {});
          if (!state.touched) { state.baseline = m; state.rows = toRows(m); }
        } catch (e) { if (!state.touched) { state.baseline = {}; state.rows = []; } }
        render();
      }).catch(function (e) {
        state.saveError = (e && e.message) || 'Failed to load environment';
        render();
      });
    }
    function seed() {
      try {
        var m = parseEnvMap((sdk.instance.config) || {});
        state.baseline = m; state.rows = toRows(m);
      } catch (e) { state.baseline = {}; state.rows = []; }
    }
    function markTouched(next) { state.touched = true; state.rows = next; state.savedNote = ''; }

    function confirmModal() {
      var m = state.modal;
      if (!m || state.saving) return;
      if (m.mode === 'import') {
        var lines = String(m.text || '').split(/\r?\n/);
        var added = 0, updated = 0, skipped = 0;
        var next = state.rows.slice();
        var indexOf = function (k) { for (var i = 0; i < next.length; i++) if (next[i].key === k) return i; return -1; };
        for (var li = 0; li < lines.length; li++) {
          var t = lines[li].trim();
          if (t === '' || t[0] === '#') continue;
          var eq = t.indexOf('=');
          if (eq <= 0) { skipped++; continue; }
          var k = t.slice(0, eq).trim();
          if (!KEY_RE.test(k) || k.length > MAX_KEY_LEN) { skipped++; continue; }
          var v = unquoteEnvValue(t.slice(eq + 1));
          if (v.length > MAX_VALUE_LEN) v = v.slice(0, MAX_VALUE_LEN);
          var at = indexOf(k);
          if (at >= 0) { if (next[at].value !== v) { next[at] = { key: k, value: v }; updated++; } }
          else {
            if (next.length >= MAX_VARS) { skipped++; continue; }
            next.push({ key: k, value: v }); added++;
          }
        }
        next.sort(function (a, b) { return a.key < b.key ? -1 : 1; });
        markTouched(next);
        state.modal = null;
        toast('Import: ' + added + ' added, ' + updated + ' updated' + (skipped > 0 ? ', ' + skipped + ' skipped' : '') + '. Review then Save.', skipped > 0 ? 'error' : 'success');
        render();
        return;
      }
      var err = keyError(m.key, state.rows, m.mode === 'edit' ? m.idx : -1);
      if (err) { m.formError = err; render(); return; }
      if (String(m.value).length > MAX_VALUE_LEN) { m.formError = 'Value is too long (max ' + MAX_VALUE_LEN + ' chars).'; render(); return; }
      var key = String(m.key).trim();
      if (m.mode === 'add') {
        if (state.rows.length >= MAX_VARS) { m.formError = 'Max ' + MAX_VARS + ' variables.'; render(); return; }
        var n2 = state.rows.concat([{ key: key, value: m.value }]);
        n2.sort(function (a, b) { return a.key < b.key ? -1 : 1; });
        markTouched(n2);
      } else {
        var n3 = state.rows.map(function (r, i) { return i === m.idx ? { key: key, value: m.value } : r; });
        n3.sort(function (a, b) { return a.key < b.key ? -1 : 1; });
        markTouched(n3);
      }
      state.modal = null;
      render();
    }
    function handleSave() {
      if (readOnly() || state.saving || !dirty()) return;
      for (var i = 0; i < state.rows.length; i++) {
        if (!KEY_RE.test(state.rows[i].key)) { state.saveError = 'Invalid key "' + state.rows[i].key + '" — use only letters, numbers and _.'; render(); return; }
      }
      ask('Save ' + state.rows.length + ' variable' + (state.rows.length === 1 ? '' : 's') + '? Environment is baked at create time — saving recreates the workload (container state is wiped and install re-runs).').then(function (ok) {
        if (!ok) return;
        state.saving = true; state.saveError = ''; state.savedNote = '';
        render();
        sdk.saveEnv(toMap(state.rows)).then(function (res) {
          state.touched = false;
          state.baseline = toMap(state.rows);
          state.saving = false;
          state.savedNote = (res && res.recreated) ? 'Saved — the workload is being recreated with the new environment.' : 'Saved.';
          toast('Environment saved', 'success');
          render();
        }).catch(function (e) {
          state.saving = false;
          state.saveError = (e && e.message) || 'Failed to save environment';
          render();
        });
      });
    }

    /* ---- Action pill (top-right): panel PageActionsPill parity.
       ks-card ks-pill-anim ks-actions-pill shell, ks-pill-content with inline
       collapse geometry, ks-tab ks-pill-toggle with Pill-tab sizing vars,
       manual chevron toggle, auto-hide on scroll / outside-tap / focus with
       idle restore, hover restores. Never invisible. ---- */
    function pillHtml(ro) {
      var off = state.pillOff ? ' ks-pill-collapsed' : '';
      var cs = off
        ? 'display:flex;align-items:center;gap:4px;max-width:0;opacity:0;transform:translateX(8px);pointer-events:none;visibility:hidden;overflow:hidden;padding:0;margin:0'
        : 'display:flex;align-items:center;gap:4px;max-width:800px;opacity:1;transform:none;overflow:visible';
      var ts = off ? '--ks-tab-px:4px' : '--ks-tab-px:var(--ks-pill-tab-px,10px)';
      var h = '<div id="env-pill-outer" style="position:fixed;top:12px;right:12px;z-index:40">'
        + '<div id="env-pill" class="ks-card ks-pill-anim ks-actions-pill' + off + '" role="toolbar" aria-label="Environment actions" style="display:flex;align-items:center;gap:4px;padding:6px;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.40);--ks-card-padding:6px">'
        + '<div class="ks-pill-content" style="' + cs + '" aria-hidden="' + (!!off) + '">'
        + '<input id="env-filter" value="' + esc(state.filter) + '" placeholder="Filter…" aria-label="Filter variables" style="width:130px;background:var(--ks-input-bg);border:1px solid var(--ks-input-border);color:var(--ks-body);border-radius:6px;font-size:12px;padding:5px 8px">'
        + '<button type="button" id="env-copy" title="Copy as .env" aria-label="Copy as .env" class="ks-btn-header ks-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>'
        + '<button type="button" id="env-dl" title="Download .env" aria-label="Download .env" class="ks-btn-header ks-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>'
        + '<button type="button" id="env-refresh" title="Refresh" aria-label="Refresh" class="ks-btn-header ks-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>'
        + (ro ? '' : '<button type="button" id="env-import" class="ks-tab" style="padding:5px 10px;font-size:13px">Import</button>'
          + '<button type="button" id="env-add" class="ks-tab" style="padding:5px 10px;font-size:13px"><span style="display:inline-flex;align-items:center;gap:6px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add</span></button>')
        + '</div>'
        + '<button type="button" id="env-pill-toggle" aria-label="' + (state.pillOff ? 'Show actions' : 'Hide actions') + '" aria-expanded="' + (!state.pillOff) + '" title="' + (state.pillOff ? 'Show actions' : 'Hide actions') + '" class="ks-tab ks-pill-toggle" style="display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;' + ts + ';--ks-tab-py:var(--ks-pill-tab-py,5px);--ks-tab-font:var(--ks-pill-tab-font,13px)">' + (state.pillOff ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>') + '</button>'
        + '</div></div>';
      return h;
    }
    function render() {
      var ro = readOnly();
      var q = state.filter.trim().toLowerCase();
      var filtered = q ? state.rows.filter(function (r) { return r.key.toLowerCase().indexOf(q) >= 0 || String(r.value).toLowerCase().indexOf(q) >= 0; }) : state.rows;
      var h = pillHtml(ro);
      if (state.saveError) h += '<div class="ks-card" style="border-color:var(--ks-bad-line);color:var(--ks-bad);font-size:12px;margin-bottom:12px">' + esc(state.saveError) + '</div>';
      if (state.savedNote) h += '<div class="ks-card" style="font-size:13px;color:var(--ks-ok);margin-bottom:12px">' + esc(state.savedNote) + '</div>';
      if (dirty()) {
        h += '<div class="ks-card" style="display:flex;flex-direction:column;gap:8px;font-size:13px;margin-bottom:12px"><span style="color:var(--ks-warn)">Unsaved changes — saving recreates the workload (container state is wiped, install re-runs).</span>'
          + '<span style="display:flex;gap:8px"><button type="button" id="env-discard" class="ks-btn"' + (state.saving ? ' disabled style="opacity:.4"' : '') + '>Discard</button>'
          + (ro ? '' : '<button type="button" id="env-save" class="ks-btn" style="background:var(--ks-btn-bg,#fff);color:var(--ks-btn-text,#000)"' + (state.saving ? ' disabled style="opacity:.4"' : '') + '>' + (state.saving ? 'Saving…' : 'Save & recreate') + '</button>') + '</span></div>';
      }
      if (ro) h += '<div class="ks-card" style="font-size:13px;color:var(--ks-muted);margin-bottom:12px">Read-only — this template disables environment editing for the page.</div>';
      var rows = '';
      for (var i = 0; i < filtered.length; i++) {
        (function (r) {
          var disp = r.value === '' ? '<span style="color:var(--ks-faint)">(empty)</span>' : esc(r.value.length > 200 ? r.value.slice(0, 200) + '…' : r.value);
          rows += '<tr style="border-top:1px solid var(--ks-card-border)"><td class="ks-mono" style="padding:8px 12px;color:var(--ks-heading);max-width:12rem;overflow:hidden;text-overflow:ellipsis" title="' + esc(r.key) + '">' + esc(r.key) + '</td>'
            + '<td class="ks-mono" style="padding:8px 12px;color:var(--ks-body);word-break:break-all;max-width:28rem" title="' + esc(r.value || '(empty)') + '">' + disp + '</td>'
            + '<td style="padding:8px 12px;text-align:right">' + (ro
              ? '<span style="font-size:12px;color:var(--ks-muted)">—</span>'
              : '<button type="button" data-edit="' + esc(r.key) + '" class="ks-btn" style="padding:4px 12px;font-size:12px">Edit</button> '
              + '<button type="button" data-delrow="' + esc(r.key) + '" class="ks-btn ks-btn-red" style="padding:4px 12px;font-size:12px">Remove</button>') + '</td></tr>';
        })(filtered[i]);
      }
      if (!filtered.length) {
        rows = '<tr><td colspan="3" style="padding:32px 12px;text-align:center;color:var(--ks-muted);font-size:13px">'
          + (state.rows.length === 0 ? (ro ? 'No variables set on this instance.' : 'No variables yet. Click Add or Import to create one.') : 'No matches for "' + esc(state.filter) + '".') + '</td></tr>';
      }
      h += '<div class="ks-card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table style="width:100%;font-size:13px"><thead><tr style="text-align:left;color:var(--ks-muted);border-bottom:1px solid var(--ks-card-border)"><th style="padding:8px 12px;font-weight:500">Key</th><th style="padding:8px 12px;font-weight:500">Value</th><th style="padding:8px 12px;font-weight:500;text-align:right">Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        + '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--ks-card-border);font-size:12px;color:var(--ks-muted)"><span>' + state.rows.length + ' variable' + (state.rows.length === 1 ? '' : 's') + (state.filter.trim() !== '' ? ' · ' + filtered.length + ' shown' : '') + '</span><span>Saving recreates the workload.</span></div></div>';
      if (state.modal) h += buildModal();
      el('root').innerHTML = h;
      wire();
    }
    function buildModal() {
      var m = state.modal;
      var foot = '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button type="button" data-x="1" class="ks-btn">Cancel</button><button type="button" id="env-ok" class="ks-btn" style="background:var(--ks-btn-bg,#fff);color:var(--ks-btn-text,#000)">' + (m.mode === 'import' ? 'Import' : (m.mode === 'edit' ? 'Save' : 'Add')) + '</button></div>';
      var inner = '';
      if (m.mode === 'import') {
        inner = '<p style="font-size:12px;color:var(--ks-muted);margin:0 0 10px">Paste <code class="ks-mono">KEY=VALUE</code> lines (one per line, <code class="ks-mono">#</code> comments ignored). Existing keys are overwritten. Review the table then Save.</p>'
          + '<textarea id="env-text" rows="8" placeholder="API_KEY=secret&#10;PORT=8080" class="ks-input ks-mono" style="width:100%;box-sizing:border-box">' + esc(m.text || '') + '</textarea>';
      } else {
        inner = (m.formError ? '<p style="font-size:12px;color:var(--ks-bad);margin:0 0 10px">' + esc(m.formError) + '</p>' : '')
          + '<label style="display:block;font-size:12px;color:var(--ks-muted);margin-bottom:4px">Key</label>'
          + '<input id="env-key" value="' + esc(m.key || '') + '" placeholder="API_KEY"' + (m.mode === 'edit' ? ' disabled style="opacity:.6"' : '') + ' class="ks-input ks-mono" style="width:100%;box-sizing:border-box">'
          + (m.mode === 'edit' ? '<p style="font-size:11px;color:var(--ks-muted);margin:6px 0 12px">Keys are immutable — remove and re-add to rename.</p>' : '<p style="font-size:11px;color:var(--ks-muted);margin:6px 0 12px">Letters, numbers and _ — must start with a letter or _.</p>')
          + '<label style="display:block;font-size:12px;color:var(--ks-muted);margin-bottom:4px">Value</label>'
          + '<textarea id="env-val" rows="3" placeholder="secret value" class="ks-input ks-mono" style="width:100%;box-sizing:border-box">' + esc(m.value || '') + '</textarea>';
      }
      return '<div data-overlay="1" style="position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.60);padding:16px">'
        + '<div class="ks-card" style="width:100%;max-width:32rem;max-height:90vh;overflow-y:auto"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:16px;font-weight:600;color:var(--ks-heading);margin:0">'
        + (m.mode === 'import' ? 'Import .env' : (m.mode === 'edit' ? 'Edit variable' : 'Add variable')) + '</h3>'
        + '<button type="button" data-x="1" aria-label="Close" style="border:none;background:transparent;color:var(--ks-muted);cursor:pointer;padding:4px">✕</button></div>'
        + inner + foot + '</div></div>';
    }
    function copyDotEnv() {
      var text = state.rows.map(function (r) { return r.key + '=' + quoteEnvValue(r.value); }).join('\n');
      if (text.trim() === '') { toast('Nothing to copy', 'error'); return; }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text + '\n').then(function () { toast('Copied .env', 'success'); });
        else toast('Copy unavailable', 'error');
      } catch (e) { toast('Copy failed', 'error'); }
    }
    function downloadDotEnv() {
      var text = state.rows.map(function (r) { return r.key + '=' + quoteEnvValue(r.value); }).join('\n');
      if (text.trim() === '') { toast('Nothing to download', 'error'); return; }
      try {
        var blob = new Blob([text + '\n'], { type: 'text/plain;charset=utf-8' });
        var url = window.URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'instance-' + (sdk.instance.id || 'env') + '.env';
        document.body.appendChild(a); a.click(); a.remove();
        window.setTimeout(function () { window.URL.revokeObjectURL(url); }, 1000);
        toast('Downloaded .env', 'success');
      } catch (e) { toast('Download failed', 'error'); }
    }
    function wire() {
      var q = function (sel, fn) {
        Array.prototype.forEach.call(document.querySelectorAll(sel), function (b) { b.addEventListener('click', fn); });
      };
      var f = el('env-filter');
      if (f) f.addEventListener('input', function () { state.filter = f.value; render(); var n = el('env-filter'); if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) {} } });
      q('#env-copy', copyDotEnv);
      q('#env-dl', downloadDotEnv);
      q('#env-refresh', function () { load(); });
      q('#env-pill-toggle', function () { showPill(); setPillOff(!state.pillOff); });
      // Hover restore rides on the CURRENT pill node (render() recreates it,
      // so this re-binds every render; the data-hover guard is per-node).
      var curPill = el('env-pill');
      if (curPill && !curPill.getAttribute('data-hover')) {
        curPill.setAttribute('data-hover', '1');
        curPill.addEventListener('mouseenter', function () { showPill(); if (state.pillOff) setPillOff(false); });
      }
      q('#env-import', function () { state.modal = { mode: 'import', text: '' }; render(); });
      q('#env-add', function () { state.modal = { mode: 'add', idx: -1, key: '', value: '', formError: '' }; render(); });
      q('#env-discard', function () { state.touched = false; state.rows = toRows(state.baseline); state.saveError = ''; state.savedNote = ''; render(); });
      q('#env-save', handleSave);
      q('[data-edit]', function () {
        var b = this;
        var key = b.getAttribute('data-edit');
        var idx = -1;
