  >' + esc(state.saveError) + '</div>';\n    if (state.savedNote) h += '<div class=\"ks-card\" style=\"font-size:13px;color:var(--ks-ok);margin-bottom:12px\">' + esc(state.savedNote) + '</div>';\n    if (dirty()) {\n      h += '<div class=\"ks-card\" style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;margin-bottom:12px\"><span style=\"color:var(--ks-warn)\">Unsaved changes — saving recreates the workload (container state is wiped, install re-runs).</span>'\n        + '<span style=\"display:flex;gap:8px\"><button type=\"button\" id=\"env-discard\" class=\"ks-btn\"' + (state.saving ? ' disabled style=\"opacity:.4\"' : '') + '>Discard</button>'\n        + (ro ? '' : '<button type=\"button\" id=\"env-save\" class=\"ks-btn\" style=\"background:var(--ks-btn-bg,#fff);color:var(--ks-btn-text,#000)\"' + (state.saving ? ' disabled style=\"opacity:.4\"' : '') + '>' + (state.saving ? 'Saving…' : 'Save & recreate') + '</button>') + '</span></div>';\n    }\n    if (ro) h += '<div class=\"\
  ks-card\" style=\"font-size:13px;color:var(--ks-muted);margin-bottom:12px\">Read-only — this template disables environment editing for the page.</div>';\n    var rows = '';\n    for (var i = 0; i < filtered.length; i++) {\n      (function (r) {\n        var disp = r.value === '' ? '<span style=\"color:var(--ks-faint)\">(empty)</span>' : esc(r.value.length > 200 ? r.value.slice(0, 200) + '…' : r.value);\n        rows += '<tr style=\"border-top:1px solid var(--ks-card-border)\"><td class=\"ks-mono\" style=\"padding:8px 12px;color:var(--ks-heading);max-width:12rem;overflow:hidden;text-overflow:ellipsis\" title=\"' + esc(r.key) + '\">' + esc(r.key) + '</td>'\n          + '<td class=\"ks-mono\" style=\"padding:8px 12px;color:var(--ks-body);word-break:break-all;max-width:28rem\" title=\"' + esc(r.value || '(empty)') + '\">' + disp + '</td>'\n          + '<td style=\"padding:8px 12px;text-align:right\">' + (ro\n            ? '<span style=\"font-size:12px;color:var(--ks-muted)\">—</span>'\n  \
  \          : '<button type=\"button\" data-edit=\"' + esc(r.key) + '\" class=\"ks-btn\" style=\"padding:4px 12px;font-size:12px\">Edit</button> '\n            + '<button type=\"button\" data-delrow=\"' + esc(r.key) + '\" class=\"ks-btn ks-btn-red\" style=\"padding:4px 12px;font-size:12px\">Remove</button>') + '</td></tr>';\n      })(filtered[i]);\n    }\n    if (!filtered.length) {\n      rows = '<tr><td colspan=\"3\" style=\"padding:32px 12px;text-align:center;color:var(--ks-muted);font-size:13px\">'\n        + (state.rows.length === 0 ? (ro ? 'No variables set on this instance.' : 'No variables yet. Click Add or Import to create one.') : 'No matches for \"' + esc(state.filter) + '\".') + '</td></tr>';\n    }\n    h += '<div class=\"ks-card\" style=\"padding:0;overflow:hidden\"><div style=\"overflow-x:auto\"><table style=\"width:100%;font-size:13px\"><thead><tr style=\"text-align:left;color:var(--ks-muted);border-bottom:1px solid var(--ks-card-border)\"><th style=\"padding:8px 12px;font-weight:500\"\
  >Key</th><th style=\"padding:8px 12px;font-weight:500\">Value</th><th style=\"padding:8px 12px;font-weight:500;text-align:right\">Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div>'\n      + '<div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--ks-card-border);font-size:12px;color:var(--ks-muted)\"><span>' + state.rows.length + ' variable' + (state.rows.length === 1 ? '' : 's') + (state.filter.trim() !== '' ? ' · ' + filtered.length + ' shown' : '') + '</span><span>Saving recreates the workload.</span></div></div>';\n    if (state.modal) h += buildModal();\n    el('root').innerHTML = h;\n    wire();\n  }\n  function buildModal() {\n    var m = state.modal;\n    var foot = '<div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:16px\"><button type=\"button\" data-x=\"1\" class=\"ks-btn\">Cancel</button><button type=\"button\" id=\"env-ok\" class=\"ks-btn\" style=\"background:var(--ks-btn-bg,#fff);color:var(--ks-btn-text,#000)\"\
  >' + (m.mode === 'import' ? 'Import' : (m.mode === 'edit' ? 'Save' : 'Add')) + '</button></div>';\n    var inner = '';\n    if (m.mode === 'import') {\n      inner = '<p style=\"font-size:12px;color:var(--ks-muted);margin:0 0 10px\">Paste <code class=\"ks-mono\">KEY=VALUE</code> lines (one per line, <code class=\"ks-mono\">#</code> comments ignored). Existing keys are overwritten. Review the table then Save.</p>'\n        + '<textarea id=\"env-text\" rows=\"8\" placeholder=\"API_KEY=secret&#10;PORT=8080\" class=\"ks-input ks-mono\" style=\"width:100%;box-sizing:border-box\">' + esc(m.text || '') + '</textarea>';\n    } else {\n      inner = (m.formError ? '<p style=\"font-size:12px;color:var(--ks-bad);margin:0 0 10px\">' + esc(m.formError) + '</p>' : '')\n        + '<label style=\"display:block;font-size:12px;color:var(--ks-muted);margin-bottom:4px\">Key</label>'\n        + '<input id=\"env-key\" value=\"' + esc(m.key || '') + '\" placeholder=\"API_KEY\"' + (m.mode === 'edit' ? ' disabled\
  \ style=\"opacity:.6\"' : '') + ' class=\"ks-input ks-mono\" style=\"width:100%;box-sizing:border-box\">'\n        + (m.mode === 'edit' ? '<p style=\"font-size:11px;color:var(--ks-muted);margin:6px 0 12px\">Keys are immutable — remove and re-add to rename.</p>' : '<p style=\"font-size:11px;color:var(--ks-muted);margin:6px 0 12px\">Letters, numbers and _ — must start with a letter or _.</p>')\n        + '<label style=\"display:block;font-size:12px;color:var(--ks-muted);margin-bottom:4px\">Value</label>'\n        + '<textarea id=\"env-val\" rows=\"3\" placeholder=\"secret value\" class=\"ks-input ks-mono\" style=\"width:100%;box-sizing:border-box\">' + esc(m.value || '') + '</textarea>';\n    }\n    return '<div data-overlay=\"1\" style=\"position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.60);padding:16px\">'\n      + '<div class=\"ks-card\" style=\"width:100%;max-width:32rem;max-height:90vh;overflow-y:auto\"><div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\"\
  ><h3 style=\"font-size:16px;font-weight:600;color:var(--ks-heading);margin:0\">'\n      + (m.mode === 'import' ? 'Import .env' : (m.mode === 'edit' ? 'Edit variable' : 'Add variable')) + '</h3>'\n      + '<button type=\"button\" data-x=\"1\" aria-label=\"Close\" style=\"border:none;background:transparent;color:var(--ks-muted);cursor:pointer;padding:4px\">✕</button></div>'\n      + inner + foot + '</div></div>';\n  }\n  function copyDotEnv() {\n    var text = state.rows.map(function (r) { return r.key + '=' + quoteEnvValue(r.value); }).join('\\n');\n    if (text.trim() === '') { toast('Nothing to copy', 'error'); return; }\n    try {\n      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text + '\\n').then(function () { toast('Copied .env', 'success'); });\n      else toast('Copy unavailable', 'error');\n    } catch (e) { toast('Copy failed', 'error'); }\n  }\n  function downloadDotEnv() {\n    var text = state.rows.map(function (r) { return r.key\
  \ + '=' + quoteEnvValue(r.value); }).join('\\n');\n    if (text.trim() === '') { toast('Nothing to download', 'error'); return; }\n    try {\n      var blob = new Blob([text + '\\n'], { type: 'text/plain;charset=utf-8' });\n      var url = window.URL.createObjectURL(blob);\n      var a = document.createElement('a');\n      a.href = url;\n      a.download = 'instance-' + (sdk.instance.id || 'env') + '.env';\n      document.body.appendChild(a); a.click(); a.remove();\n      window.setTimeout(function () { window.URL.revokeObjectURL(url); }, 1000);\n      toast('Downloaded .env', 'success');\n    } catch (e) { toast('Download failed', 'error'); }\n  }\n  function wire() {\n    var q = function (sel, fn) {\n      Array.prototype.forEach.call(document.querySelectorAll(sel), function (b) { b.addEventListener('click', fn); });\n    };\n    var f = el('env-filter');\n    if (f) f.addEventListener('input', function () { state.filter = f.value; render(); var n = el('env-filter'); if (n) { n.focus();\
  \ try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) {} } });\n    q('#env-copy', copyDotEnv);\n    q('#env-dl', downloadDotEnv);\n    q('#env-refresh', function () { load(); });\n    q('#env-import', function () { state.modal = { mode: 'import', text: '' }; render(); });\n    q('#env-add', function () { state.modal = { mode: 'add', idx: -1, key: '', value: '', formError: '' }; render(); });\n    q('#env-discard', function () { state.touched = false; state.rows = toRows(state.baseline); state.saveError = ''; state.savedNote = ''; render(); });\n    q('#env-save', handleSave);\n    q('[data-edit]', function () {\n      var b = this;\n      var key = b.getAttribute('data-edit');\n      var idx = -1;\n      for (var i = 0; i < state.rows.length; i++) if (state.rows[i].key === key) idx = i;\n      if (idx < 0) return;\n      state.modal = { mode: 'edit', idx: idx, key: state.rows[idx].key, value: state.rows[idx].value, formError: '' };\n      render();\n    });\n    q('[data-delrow]',\
  \ function () {\n      var b = this;\n      var key = b.getAttribute('data-delrow');\n      ask('Remove \"' + key + '\" from this instance\\'s environment? Saving recreates the workload.').then(function (ok) {\n        if (!ok) return;\n        markTouched(state.rows.filter(function (r) { return r.key !== key; }));\n        render();\n      });\n    });\n    q('[data-x]', function () { state.modal = null; render(); });\n    var ov = document.querySelector('[data-overlay]');\n    if (ov) ov.addEventListener('click', function (ev) { if (ev.target === ov) { state.modal = null; render(); } });\n    q('#env-ok', confirmModal);\n    var t = el('env-text');\n    if (t) t.addEventListener('input', function () { state.modal.text = t.value; });\n    var k = el('env-key');\n    if (k) k.addEventListener('input', function () { state.modal.key = k.value; state.modal.formError = ''; });\n    var v = el('env-val');\n    if (v) v.addEventListener('input', function () { state.modal.value = v.value; });\n\
  \  }\n  function start(s) {\n    sdk = s;\n    seed();\n    render();\n    load();\n  }\n  if (window.KSPageSDK) start(window.KSPageSDK);\n  else window.addEventListener('ks-page-sdk-ready', function () { start(window.KSPageSDK); }, { once: true });\n})();\n</script>"
