              else if (f === 'command') st.command = n.value.slice(0, 8000);
              else if (f === 'payload') st.payload = n.value.slice(0, 128);
              else if (f === 'kind' || f === 'if') { st[f] = n.value; render(); return; }
              paintDirty();
            });
          })(ins[ii]);
        }
      }
      function paintDirty() {
        var s = el('ed-dirty');
        if (s) s.style.display = dirty() ? '' : 'none';
      }
      function start(s) {
        sdk = s;
        state.readOnly = isReadOnly();
        state.ceiling = cfgNumBoth('max_timeout_sec', 'max_timeout_sec', 1800, 1800);
        var kinds = [];
        if (cfgBoolBoth('allow_shell', 'allow_shell', true)) kinds.push('shell');
        if (cfgBoolBoth('allow_power', 'allow_power', true)) kinds.push('power');
        if (cfgBoolBoth('allow_actions', 'allow_actions', true)) kinds.push('action');
        state.allowedKinds = kinds.length ? kinds : ['shell', 'power', 'action'];
        state.maxActive = cfgNumBoth('max_active_jobs', 'max_active_jobs', 1000, 0);
        var idRaw = qparam('id');
        state.jobId = (idRaw !== '' && Number.isFinite(Number(idRaw))) ? Number(idRaw) : null;
        load();
      }
      if (window.KSPageSDK) start(window.KSPageSDK);
      else window.addEventListener('ks-page-sdk-ready', function () { start(window.KSPageSDK); }, { once: true });
    })();
    </script>
  content_markdown: ''
  content_blocks: ''
components:
- name: pill_css
  type: html
  description: 'Pill fallback CSS: action/tabs/save pill geometry when the host theme has no Pill tab vars.'
  content: |-
    <style id="ks-automation-pills">/* Automation pills — panel PageActionsPill / PageTabsPill / PageFormActionsPill parity.
       Paint comes from Theme Studio Pill vars (--ks-pill-*) injected by the host;
       these fallbacks reproduce the historic geometry when no theme sets them. */
    .ks-actions-pill,.ks-tabs-pill,.ks-form-actions-pill{--ks-card-padding:6px}
    .ks-pill-anim{transition:transform .25s ease,opacity .25s ease}
    .ks-pill-toggle{--ks-tab-px:var(--ks-pill-tab-px,10px);--ks-tab-py:var(--ks-pill-tab-py,5px);--ks-tab-font:var(--ks-pill-tab-font,13px)}
    .ks-pill-content{transition:max-width .3s ease,opacity .3s ease,transform .3s ease}
    .ks-pill-off .ks-pill-content{max-width:0 !important;opacity:0 !important;pointer-events:none !important;visibility:hidden !important;overflow:hidden !important;padding:0 !important;margin:0 !important}
    .au-tabbtn{--ks-tab-px:var(--ks-pill-tab-px,10px);--ks-tab-py:var(--ks-pill-tab-py,5px);--ks-tab-font:var(--ks-pill-tab-font,13px)}
    @keyframes ks-overlay-in{from{opacity:0}to{opacity:1}}
    @keyframes ks-modal-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
    @keyframes ks-skeleton-p{0%,100%{opacity:1}50%{opacity:.45}}
    </style>
- name: icon_refresh
  type: html
  description: Refresh glyph for the action pill.
  content: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
- name: icon_plus
  type: html
  description: Plus glyph for New job.
  content: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
- name: icon_back
  type: html
  description: Back chevron for the editor header.
  content: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
- name: icon_chev_left
