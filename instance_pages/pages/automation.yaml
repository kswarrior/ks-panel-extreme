# Automation — instance page (YAML authoring format).
# Converted from automation.json; edit this file, not JSON.
# Multiline content uses `|` literal blocks (raw HTML/JS, no escaping);
# actions/sub_pages/components/configure are native YAML lists.
# See instance_pages/README.md for the field reference.
name: Automation
slug: automation
kind: custom
category: automation
type: automation
description: Scheduled and manual jobs for this instance with run history, YAML transfer, and a full job editor.
content_type: html
content_html: |-
  {{component:ks_theme_head}}<div class="ks-page">
    <style id="ks-automation-pills">/* Automation pills — panel PageActionsPill / PageTabsPill / PageFormActionsPill parity.
     Paint comes from Theme Studio Pill vars (--ks-pill-*) injected by the host;
     these fallbacks reproduce the historic geometry when no theme sets them. */
  .ks-actions-pill,.ks-tabs-pill,.ks-form-actions-pill{--ks-card-padding:6px}
  .ks-pill-anim{transition:transform .25s ease,opacity .25s ease}
  .ks-pill-toggle{--ks-tab-px:var(--ks-pill-tab-px,10px);--ks-tab-py:var(--ks-pill-tab-py,5px);--ks-tab-font:var(--ks-pill-tab-font,13px)}
  .ks-pill-content{transition:max-width .3s ease,opacity .3s ease,transform .3s ease}
  .au-tabbtn{--ks-tab-px:var(--ks-pill-tab-px,10px);--ks-tab-py:var(--ks-pill-tab-py,5px);--ks-tab-font:var(--ks-pill-tab-font,13px)}
  @keyframes ks-overlay-in{from{opacity:0}to{opacity:1}}
  @keyframes ks-modal-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes ks-skeleton-p{0%,100%{opacity:1}50%{opacity:.45}}
  </style>
    <div id="root"><div class="ks-card"><div class="ks-skeleton-bar" style="height:12px;width:40%;margin-bottom:8px"></div><div class="ks-skeleton" style="height:12px;width:65%"></div></div></div>
  </div>
  <script>
  (function () {
    'use strict';
    var sdk = null;
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function toast(m, t) { try { sdk.toast(m, t || 'info'); } catch (e) {} }
    function ask(m) {
      try { if (sdk && typeof sdk.confirm === 'function') return sdk.confirm(m); } catch (e) {}
      return Promise.resolve(window.confirm(m));
    }
    /* ---- page config: Studio Configure vars (KS_PAGE_CONFIG) overlaid on
       template Instance Controls (instance.config.instance_controls.shortcuts.automation).
       Page values win when set; otherwise the template snapshot applies; otherwise allow-all
       defaults (mirrors resolveInstanceControls + backend automationKindAllowed). ---- */
    function pageCfgRaw(name) {
      try {
        var c = window.KS_PAGE_CONFIG || {};
        if (c[name] !== undefined && c[name] !== null && String(c[name]) !== '') return String(c[name]);
      } catch (e) {}
      return '';
    }
    function controlsAutomation() {
      try {
        var cfg = (sdk && sdk.instance && sdk.instance.config) || {};
        if (typeof cfg === 'string') { try { cfg = JSON.parse(cfg); } catch (e) { return {}; } }
        var ic = (cfg && cfg.instance_controls) || {};
        var sc = (ic && ic.shortcuts) || {};
        return (sc && sc.automation) || {};
      } catch (e) { return {}; }
    }
    function cfgBoolBoth(pageName, ctrlName, dflt) {
      var pv = pageCfgRaw(pageName);
      var cv = null;
      try { var a = controlsAutomation(); if (a[ctrlName] !== undefined) cv = a[ctrlName]; } catch (e) {}
      // Template controls win when explicitly false (deny overrides allow).
      if (cv === false) return false;
      if (pv !== '') return !(pv === 'false' || pv === '0' || pv === 'off');
      if (typeof cv === 'boolean') return cv;
      return dflt;
    }
    function cfgNumBoth(pageName, ctrlName, cap, dflt) {
      var out = dflt;
      var seen = false;
      var vals = [];
      var pv = pageCfgRaw(pageName);
      if (pv !== '') { var pn = parseInt(pv, 10); if (Number.isFinite(pn) && pn > 0) vals.push(Math.max(1, Math.min(cap, pn))); }
      try {
        var a = controlsAutomation();
        var cv = a[ctrlName];
        var cn = (typeof cv === 'number') ? Math.floor(cv) : parseInt(String(cv == null ? '' : cv), 10);
        if (Number.isFinite(cn) && cn > 0) vals.push(Math.max(1, Math.min(cap, cn)));
      } catch (e) {}
      if (!vals.length) return dflt;
      // Strictest ceiling wins (smallest positive cap).
      var m = vals[0];
      for (var i = 1; i < vals.length; i++) if (vals[i] < m) m = vals[i];
      return m;
    }
    function readOnly() {
      // Page read_only OR template allow_edit === false both hide mutators.
      try {
        var c = window.KS_PAGE_CONFIG || {};
        if (c.read_only === 'true' || c.read_only === '1' || c.read_only === 'on') return true;
      } catch (e) {}
      try { if (controlsAutomation().allow_edit === false) return true; } catch (e) {}
      return false;
    }
    function allowedKinds() {
      var kinds = [];
      if (cfgBoolBoth('allow_shell', 'allow_shell', true)) kinds.push('shell');
      if (cfgBoolBoth('allow_power', 'allow_power', true)) kinds.push('power');
      if (cfgBoolBoth('allow_actions', 'allow_actions', true)) kinds.push('action');
      return kinds.length ? kinds : ['shell', 'power', 'action'];
    }
    /* ---- dynamic slug: the automation family slug is customizable per template
       (shortcuts.automation.slug). Derive sibling URLs from the live pageSlug
       instead of hardcoding "automation" so renamed pages keep working. ---- */
    function familySlug() {
      try {
        var ps = String((sdk && sdk.pageSlug) || '').split('?')[0].split('#')[0];
        ps = ps.replace(/^\/+|\/+$/g, '');
        if (ps !== '') return ps.split('/')[0];
      } catch (e) {}
      try {
        var s = String((controlsAutomation().slug) || '').replace(/^\/+|\/+$/g, '');
        if (s !== '') return s.split('/')[0];
      } catch (e) {}
      return 'automation';
    }
    function editUrl(id) {
      return '/instances/' + sdk.instance.id + '/' + familySlug() + '/edit' + (id != null ? '?id=' + encodeURIComponent(id) : '');
    }
    function fmtTime(iso) {
      if (!iso) return '—';
      var t = new Date(iso).getTime();
      return Number.isNaN(t) ? String(iso) : new Date(iso).toLocaleString();
    }

    var state = {
      jobs: [], runs: [], loading: true, error: '',
      tab: 'tasks', runBusyId: null,
      importUrl: '', importBusy: false, showImportUrl: false,
      pillOff: false
    };
    function el(id) { return document.getElementById(id); }

    function load() {
      state.loading = true; state.error = '';
      render();
      Promise.all([sdk.listAutomation(), sdk.listAutomationRuns(50)]).then(function (jr) {
        state.jobs = Array.isArray(jr[0]) ? jr[0] : [];
        state.runs = Array.isArray(jr[1]) ? jr[1] : [];
        state.loading = false;
        render();
      }).catch(function (e) {
        state.loading = false;
        state.error = (e && e.message) || 'Failed to load automation';
        render();
      });
    }
    function handleDelete(job) {
      ask('Delete "' + job.name + '"? Run history will be removed.').then(function (ok) {
        if (!ok) return;
        sdk.deleteAutomationJob(job.id).then(function () { toast('Job deleted', 'success'); load(); })
          .catch(function (e) { toast((e && e.message) || 'Delete failed', 'error'); });
      });
    }
    function handleRunNow(job) {
      if (state.runBusyId !== null) return;
      state.runBusyId = job.id;
      render();
      sdk.runAutomationJob(job.id).then(function (res) {
        toast('Run finished (exit ' + (res && res.exit_code) + ')', res && res.exit_code === 0 ? 'success' : 'error');
        state.tab = 'runs';
        state.runBusyId = null;
        load();
      }).catch(function (e) {
        state.runBusyId = null;
        toast((e && e.message) || 'Run failed', 'error');
        render();
      });
    }
    function b64ToU8(b64) {
      var bin = atob(String(b64 || '').replace(/\s+/g, ''));
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function handleDownload(job) {
      sdk.downloadAutomation(job.id).then(function (r) {
        var blob = new Blob([b64ToU8(r.base64)], { type: 'text/yaml' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = (String(job.name).replace(/[^a-zA-Z0-9-_ .]/g, '_').slice(0, 64) || 'automation') + '.yaml';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }).catch(function (e) { toast((e && e.message) || 'Download failed', 'error'); });
    }
    function handleLocalFile(f) {
      if (!f || state.importBusy) return;
      state.importBusy = true;
      render();
      var form = new FormData();
      form.append('file', f);
      sdk.fetchPanel('/automation/import', { method: 'POST', body: form }).then(function (res) {
        toast('Imported (job #' + ((res && res.id) || '?') + ')', 'success');
        state.importBusy = false;
        load();
      }).catch(function (e) {
        state.importBusy = false;
        toast((e && e.message) || 'Import failed', 'error');
        render();
      });
    }
    function handleImportUrl() {
      var u = state.importUrl.trim();
      if (!u || state.importBusy) return;
      state.importBusy = true;
      render();
      sdk.importAutomationURL(u).then(function (res) {
        toast('Imported (job #' + ((res && res.id) || '?') + ')', 'success');
        state.importUrl = ''; state.showImportUrl = false; state.importBusy = false;
        load();
      }).catch(function (e) {
        state.importBusy = false;
        toast((e && e.message) || 'Import failed', 'error');
        render();
      });
    }

    function jobSummary(job) {
      var n = Array.isArray(job.steps) ? job.steps.length : 0;
      if (n > 0) return n + ' step' + (n === 1 ? '' : 's') + ' · ' + job.kind;
      return job.command || (job.kind + ':' + (job.payload || ''));
    }
    /* ---- Action pill (top-right): panel PageActionsPill parity.
       ks-card ks-pill-anim ks-actions-pill shell, ks-tab ks-pill-toggle buttons
       with Pill-tab sizing vars, manual </> toggle, auto-hide on scroll /
       outside-tap with idle restore, hover restores. Never invisible. ---- */
    function pillHtml(ro) {
      var off = state.pillOff ? ' ks-pill-collapsed' : '';
      var cs = state.pillOff
        ? 'display:flex;align-items:center;gap:4px;max-width:0;opacity:0;transform:translateX(8px);pointer-events:none;visibility:hidden;overflow:hidden;padding:0;margin:0'
        : 'display:flex;align-items:center;gap:4px;max-width:800px;opacity:1;transform:none;overflow:visible';
      var ts = state.pillOff ? '--ks-tab-px:4px' : '--ks-tab-px:var(--ks-pill-tab-px,10px)';
      var h = '<div id="au-pill-outer" style="position:fixed;top:12px;right:12px;z-index:40">'
        + '<div id="au-pill" class="ks-card ks-pill-anim ks-actions-pill' + off + '" role="toolbar" aria-label="Automation actions" style="display:flex;align-items:center;gap:4px;padding:6px;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.40);--ks-card-padding:6px">'
        + '<div class="ks-pill-content" style="' + cs + '" aria-hidden="' + (!!state.pillOff) + '">'
        + '<button type="button" id="au-refresh" title="Refresh" aria-label="Refresh" class="ks-btn-header ks-icon-btn"' + (state.loading ? ' disabled style="opacity:.4"' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>'
        + (ro ? '' : '<button type="button" id="au-new" title="Create task" aria-label="Create task" class="ks-tab au-tabbtn" style="padding:5px 10px;font-size:13px"><span style="display:inline-flex;align-items:center;gap:6px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New job</span></button>')
        + '</div>'
        + '<button type="button" id="au-pill-toggle" aria-label="' + (state.pillOff ? 'Show actions' : 'Hide actions') + '" aria-expanded="' + (!state.pillOff) + '" title="' + (state.pillOff ? 'Show actions' : 'Hide actions') + '" class="ks-tab ks-pill-toggle" style="display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;' + ts + ';--ks-tab-py:var(--ks-pill-tab-py,5px);--ks-tab-font:var(--ks-pill-tab-font,13px)">' + (state.pillOff ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>') + '</button>'
        + '</div></div>';
      return h;
    }
    function render() {
      var ro = readOnly();
      var h = pillHtml(ro);
      if (state.loading && !state.jobs.length && !state.runs.length) {
        h += '<div class="ks-card"><div class="ks-skeleton-bar" style="height:12px;width:40%;margin-bottom:8px"></div><div class="ks-skeleton" style="height:12px;width:65%"></div></div>';
      } else if (!state.loading && state.error && !state.jobs.length && !state.runs.length) {
        h += '<div class="ks-card" style="text-align:center;padding:32px 16px"><p style="font-size:14px;color:var(--ks-heading);margin:0 0 4px">Failed to load automation</p><p style="font-size:12px;color:var(--ks-muted);margin:0 0 12px">' + esc(state.error) + '</p><button type="button" id="au-retry" class="ks-btn ks-btn-primary">Retry</button></div>';
      } else {
        h += '<div class="ks-tabs" role="tablist" aria-label="Automation views" style="margin-bottom:10px">'
          + '<button type="button" role="tab" aria-selected="' + (state.tab === 'tasks') + '" data-autab="tasks" class="ks-tab au-tabbtn' + (state.tab === 'tasks' ? ' ks-tab-active' : '') + '">Tasks (' + state.jobs.length + ')</button>'
          + '<button type="button" role="tab" aria-selected="' + (state.tab === 'runs') + '" data-autab="runs" class="ks-tab au-tabbtn' + (state.tab === 'runs' ? ' ks-tab-active' : '') + '">Recent runs (' + state.runs.length + ')</button>'
          + '</div>';
        if (state.error) h += '<div class="ks-card" style="border-color:var(--ks-bad-line);color:var(--ks-bad);font-size:12px;margin-bottom:12px">' + esc(state.error) + '</div>';
        if (!ro) {
          h += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">'
            + '<label class="ks-tab au-tabbtn" style="padding:5px 10px;font-size:13px;cursor:pointer">'
            + '<input type="file" id="au-file" accept=".yaml,.yml,.json" style="display:none"' + (state.importBusy ? ' disabled' : '') + '>'
            + (state.importBusy ? 'Importing…' : 'Upload YAML') + '</label>'
            + '<button type="button" id="au-urltoggle" class="ks-tab au-tabbtn" style="padding:5px 10px;font-size:13px">Import from URL</button>'
            + (state.showImportUrl ? '<span style="display:inline-flex;align-items:center;gap:8px;flex:1;min-width:12rem"><input id="au-url" value="' + esc(state.importUrl) + '" placeholder="https://example.com/backup.yaml" aria-label="Automation YAML URL" class="ks-input ks-mono" style="flex:1;min-width:0">'
              + '<button type="button" id="au-urlgo" class="ks-btn ks-btn-primary"' + (state.importBusy || !state.importUrl.trim() ? ' disabled style="opacity:.5"' : '') + '>' + (state.importBusy ? 'Importing…' : 'Import') + '</button></span>' : '')
            + '</div>';
        }
        if (state.tab === 'tasks') {
          if (!state.jobs.length) {
            h += '<div class="ks-card" style="text-align:center;padding:40px 24px"><p style="font-size:13px;color:var(--ks-body);margin:0">No automation jobs yet.</p><p style="font-size:12px;color:var(--ks-muted);margin:4px 0 0">Click New job to schedule a command inside this instance.</p></div>';
          } else {
            h += '<div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">';
            for (var i = 0; i < state.jobs.length; i++) {
              (function (job) {
                h += '<div class="ks-card ks-list-card" data-ks-key="' + job.id + '" style="display:flex;flex-direction:column;gap:8px;min-width:0">'
                  + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-width:0">'
                  + '<div style="min-width:0;display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:9999px;flex-shrink:0;background:' + (job.enabled ? 'var(--ks-ok)' : 'var(--ks-muted)') + '" title="' + (job.enabled ? 'Enabled' : 'Disabled') + '"></span>'
                  + '<h3 style="font-size:13px;font-weight:600;color:var(--ks-heading);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(job.name) + '">' + esc(job.name) + '</h3></div>'
                  + '<span style="display:flex;gap:4px;flex-shrink:0">'
                  + (!ro ? '<button type="button" data-run="' + job.id + '" title="Run now" class="ks-btn ks-btn-sm"' + (state.runBusyId === job.id ? ' disabled style="opacity:.5"' : '') + '>' + (state.runBusyId === job.id ? 'Running…' : 'Run') + '</button>' : '')
                  + (!ro ? '<button type="button" data-edit="' + job.id + '" title="Edit" class="ks-btn ks-btn-sm">Edit</button>' : '')
                  + '<button type="button" data-dl="' + job.id + '" title="Download YAML" class="ks-btn ks-btn-sm">YAML</button>'
                  + (!ro ? '<button type="button" data-del="' + job.id + '" title="Delete" class="ks-btn ks-btn-red ks-btn-sm">Del</button>' : '')
                  + '</span></div>'
                  + '<p class="ks-mono" style="font-size:12px;color:var(--ks-body);word-break:break-all;margin:0" title="' + esc(job.command || '') + '">' + esc(jobSummary(job)) + '</p>';
                var n = Array.isArray(job.steps) ? job.steps.length : 0;
                if (n > 0) {
                  h += '<ul style="font-size:11px;color:var(--ks-muted);margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px">';
                  for (var si = 0; si < Math.min(4, n); si++) {
                    var s = job.steps[si] || {};
                    h += '<li class="ks-mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(s.name + ' [' + (s.kind || 'shell') + ', if: ' + (s.if || 'success') + ']') + '">' + (si + 1) + '. ' + esc(s.name) + ' <span style="opacity:.6">[' + esc(s.kind || 'shell') + ' · if:' + esc(s.if || 'success') + ']</span></li>';
                  }
                  if (n > 4) h += '<li style="opacity:.6">+' + (n - 4) + ' more…</li>';
                  h += '</ul>';
                }
                h += '<div style="font-size:11px;color:var(--ks-muted);display:flex;flex-direction:column;gap:2px">'
                  + '<div>Schedule <span class="ks-mono" style="color:var(--ks-body)">' + esc((job.schedule || '').trim() !== '' ? job.schedule : 'manual only') + '</span></div>'
                  + '<div>Next <span>' + esc(fmtTime(job.next_run_at)) + '</span> · Last <span>' + esc(fmtTime(job.last_run_at)) + '</span></div>'
                  + ((job.secret_refs || []).length ? '<div>Secrets <span class="ks-mono">' + esc(job.secret_refs.join(', ')) + '</span></div>' : '')
                  + '<div>Timeout <span>' + (job.timeout_sec > 0 ? job.timeout_sec + 's' : 'default') + '</span></div>'
                  + '</div></div>';
              })(state.jobs[i]);
            }
            h += '</div>';
          }
        } else {
          if (!state.runs.length) {
            h += '<div class="ks-card" style="text-align:center;padding:40px 24px"><p style="font-size:13px;color:var(--ks-body);margin:0">No runs yet.</p><p style="font-size:12px;color:var(--ks-muted);margin:4px 0 0">Manual and scheduled executions appear here.</p></div>';
          } else {
            var rh = '';
            for (var ri = 0; ri < state.runs.length; ri++) {
              (function (run) {
                var jn = '#' + run.job_id;
                for (var ji = 0; ji < state.jobs.length; ji++) if (state.jobs[ji].id === run.job_id) jn = state.jobs[ji].name;
                rh += '<tr style="border-top:1px solid var(--ks-card-border);vertical-align:top"><td style="padding:8px 12px;color:var(--ks-heading);max-width:12rem;overflow:hidden;text-overflow:ellipsis" title="' + esc(jn) + '">' + esc(jn) + '</td>'
                  + '<td style="padding:8px 12px;color:var(--ks-body)">' + esc(run.trigger) + '</td>'
                  + '<td class="ks-mono" style="padding:8px 12px;color:' + (run.exit_code === 0 ? 'var(--ks-ok)' : 'var(--ks-bad)') + '">' + esc(run.exit_code) + '</td>'
                  + '<td class="ks-mono" style="padding:8px 12px;color:var(--ks-body)">' + esc(run.duration_ms) + 'ms</td>'
                  + '<td style="padding:8px 12px;color:var(--ks-muted);white-space:nowrap">' + esc(fmtTime(run.started_at)) + '</td>'
                  + '<td style="padding:8px 12px;min-width:16rem;max-width:28rem">'
                  + (run.error ? '<p style="font-size:12px;color:var(--ks-bad);word-break:break-word;margin:0 0 4px">' + esc(run.error) + '</p>' : '')
                  + (run.stdout ? '<pre class="ks-mono" style="font-size:11px;color:var(--ks-body);white-space:pre-wrap;word-break:break-all;max-height:6rem;overflow:auto;margin:0">' + esc(String(run.stdout).slice(0, 2000)) + '</pre>' : '')
                  + (run.stderr ? '<pre class="ks-mono" style="font-size:11px;color:var(--ks-warn);white-space:pre-wrap;word-break:break-all;max-height:6rem;overflow:auto;margin:4px 0 0">' + esc(String(run.stderr).slice(0, 2000)) + '</pre>' : '')
                  + (!run.stdout && !run.stderr && !run.error ? '<span style="font-size:12px;color:var(--ks-muted)">—</span>' : '')
                  + '</td></tr>';
              })(state.runs[ri]);
            }
