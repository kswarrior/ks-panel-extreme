  user_viewable: true
  user_editable: true
  required: false
  rule: ''
  display: toggle
  options: ''
  append: false
  prepend: ''
  append_value: ''
- name: allow_shell
  label: Shell command jobs
  description: Operators may create jobs that run their own shell command inside the instance. AND-gated with template Instance Controls → Automation → allow_shell.
  default: 'true'
  user_viewable: true
  user_editable: true
  required: false
  rule: ''
