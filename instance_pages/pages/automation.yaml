        else { c.style.maxWidth = '800px'; c.style.opacity = '1'; c.style.transform = 'none'; c.style.pointerEvents = 'auto'; c.style.visibility = 'visible'; c.style.overflow = 'visible'; c.style.padding = ''; c.style.margin = ''; }
