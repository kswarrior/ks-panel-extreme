- name: empty_tasks
  type: html
  description: Empty state when no automation jobs exist.
  content: <div class="ks-card" style="text-align:center;padding:40px 24px"><p style="font-size:13px;color:var(--ks-body);margin:0">No automation jobs yet.</p><p style="font-size:12px;color:var(--ks-muted);margin:4px 0 0">Click New job to schedule a command inside this instance.</p></div>
- name: empty_runs
  type: html
  description: Empty state when no runs recorded.
  content: <div class="ks-card" style="text-align:center;padding:40px 24px"><p style="font-size:13px;color:var(--ks-body);margin:0">No runs yet.</p><p style="font-size:12px;color:var(--ks-muted);margin:4px 0 0">Manual and scheduled executions appear here.</p></div>
configure:
- name: read_only
  label: Read-only
  description: Hide New job, upload, import, edit, delete and Run — jobs and runs stay readable. Also honors template Instance Controls → Automation → allow_edit=false.
