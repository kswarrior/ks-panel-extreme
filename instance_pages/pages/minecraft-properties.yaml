        }
      }
      document.addEventListener('keydown', onKey);
      return function () {
        mounted.current = false;
        document.removeEventListener('keydown', onKey);
      };
    }, []);

    function widget(f, v, dis) {
      var key = f.k;
      var common = {
        'aria-label': f.label,
        disabled: !!dis,
        value: v == null ? '' : String(v),
        style: FIELD_STYLE,
        onChange: function (ev) { S.values[key] = ev.target.value; if (S.error) S.error = ''; render(); }
      };
      if (f.t === 'bool') {
        var bv = common.value;
        var bopts = [
          el('option', { key: 't', value: 'true', style: OPT_STYLE }, 'true'),
          el('option', { key: 'f', value: 'false', style: OPT_STYLE }, 'false')
        ];
        if (bv !== 'true' && bv !== 'false') {
          bopts = [el('option', { key: '__custom', value: bv, style: OPT_STYLE }, String(bv) + ' (custom)')].concat(bopts);
        }
        return el('select', common, bopts);
      }
      if (f.t === 'enum') {
        var opts = (f.opts || []).map(function (o) { return el('option', { key: String(o), value: String(o), style: OPT_STYLE }, String(o)); });
        if ((f.opts || []).indexOf(String(v)) < 0) {
          opts = [el('option', { key: '__custom', value: String(v), style: OPT_STYLE }, String(v) + ' (custom)')].concat(opts);
        }
        return el('select', common, opts);
      }
      if (f.t === 'int') {
        return el('input', Object.assign({}, common, { type: 'text', inputMode: 'numeric', pattern: '-?[0-9]*', autoComplete: 'off' }));
      }
      if (f.t === 'password') {
        return el('input', Object.assign({}, common, { type: 'password', placeholder: f.ph || '', autoComplete: 'new-password' }));
      }
      return el('input', Object.assign({}, common, { type: 'text', placeholder: f.ph || '' }));
    }

    function row(f, idx) {
      var v = S.values[f.k];
      var mod = isMod(f.k);
      var busy = !!S.busy[f.k];
      var lock = busy || S.applyingAll;
      var prob = (mod && !S.applyingAll) ? fieldProblem(f, v) : null;
      var kind = f.t === 'bool' ? 'true / false' : (f.t === 'enum' ? 'options' : (f.t === 'int' ? 'number' : (f.t === 'password' ? 'password' : 'text')));
      var dotColor = busy ? 'var(--ks-info, #38bdf8)' : (mod ? 'var(--ks-warn, #fcd34d)' : 'var(--ks-ok, #34d399)');
      var dotTitle = mod ? (busy ? 'applying…' : 'changed — not yet applied') : 'in sync with disk';
      return el('div', {
        key: f.k,
        style: {
          display: 'flex', gap: '10px', alignItems: 'flex-start',
          padding: '12px 0', opacity: lock ? 0.7 : 1,
          borderTop: idx === 0 ? 'none' : '1px solid var(--ks-card-border, rgba(255,255,255,0.08))'
        }
      },
        el('span', { title: dotTitle, style: { flex: 'none', width: '8px', height: '8px', borderRadius: '9999px', marginTop: '6px', background: dotColor } }),
        el('div', { style: { flex: 1, minWidth: 0 } },
          el('div', { style: { display: 'flex', alignItems: 'baseline', gap: '8px', flexWrap: 'wrap' } },
            el('span', { style: { fontSize: '13px', fontWeight: 600, color: 'var(--ks-heading, #fff)' } }, f.label),
            el('span', { className: 'ks-mono ks-muted', style: { fontSize: '11px' } }, f.k),
            el('span', { className: 'ks-muted', style: { fontSize: '10px' } }, kind),
            mod ? el('span', { style: { fontSize: '10px', fontWeight: 700, color: 'var(--ks-warn, #fcd34d)' } }, '● modified') : null),
          el('div', { className: 'ks-muted', style: { fontSize: '11px', margin: '2px 0 6px' } }, f.desc),
          widget(f, v, lock),
          prob ? el('div', { style: { fontSize: '11px', marginTop: '4px', color: 'var(--ks-bad, #fca5a5)' } }, prob) : null));
    }

    function body() {
      if (S.loading) {
        return el('div', { className: 'ks-card' },
          el('p', { className: 'ks-muted', style: { fontSize: '13px', margin: 0 } }, 'Reading properties…'));
      }
      if (S.gate) {
        return el('div', { className: 'ks-card' },
          el('p', { style: { color: 'var(--ks-bad)', fontSize: '13px', margin: 0 } }, 'Page not enabled for this instance — link the Server Properties page to its template first.'));
      }
      if (S.error && !S.activePath) {
        return el('div', { className: 'ks-card' },
          el('p', { style: { color: 'var(--ks-bad)', fontSize: '13px', margin: '0 0 8px' } }, S.error),
          el('button', { type: 'button', className: 'ks-btn ks-btn-sm', onClick: function () { load(); } }, 'Retry'));
      }
      var defs = visibleDefs();
      if (!defs.length) {
        return el('div', { className: 'ks-card' },
          el('p', { className: 'ks-muted', style: { fontSize: '13px', margin: 0 } }, 'No keys match this filter.'));
      }
      // Single flat card: every key in one list, no category sections.
      return el('div', { className: 'ks-card', style: { padding: '4px 16px 12px' } },
        defs.map(function (f, i) { return row(f, i); }));
    }

    function actionPill() {
      if (S.loading || S.gate || (S.error && !S.activePath)) return null;
      var pending = modKeys().length;
      return el('div', {
        style: {
          position: 'sticky', bottom: '12px', zIndex: 20,
          display: 'flex', justifyContent: 'center',
          marginTop: '14px', pointerEvents: 'none'
        }
      },
        el('div', {
          style: {
            pointerEvents: 'auto', display: 'flex', alignItems: 'center', gap: '8px',
            background: 'var(--ks-card-bg, rgba(17,24,39,0.92))',
            border: '1px solid var(--ks-card-border, rgba(255,255,255,0.12))',
            borderRadius: '9999px', padding: '8px 8px 8px 16px',
            boxShadow: '0 8px 30px rgba(0,0,0,0.45)',
            backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)'
          }
        },
          el('span', { className: 'ks-muted', style: { fontSize: '12px', whiteSpace: 'nowrap' } },
            S.applyingAll ? 'Applying…' : (pending ? (pending + ' pending change' + (pending === 1 ? '' : 's')) : 'No pending changes')),
          el('button', {
            type: 'button', className: 'ks-btn ks-btn-sm',
            style: { borderRadius: '9999px' },
            disabled: S.applyingAll || pending === 0,
            title: 'Discard all pending edits',
            onClick: cancelAll
          }, 'Cancel'),
          el('button', {
            type: 'button', className: 'ks-btn ks-btn-sm',
            style: { borderRadius: '9999px' },
            disabled: S.applyingAll || pending === 0,
            title: 'Apply every pending key (Ctrl/Cmd+S)',
            onClick: applyAll
          }, S.applyingAll ? 'Applying…' : ('Apply' + (pending ? ' (' + pending + ')' : '')))));
    }

    var pending = modKeys().length;
    var blocked = S.gate || (!!S.error && !S.activePath);
    return el('div', { className: 'ks-page' },
      blocked ? null : el('div', { className: 'ks-row', style: { gap: '8px', marginBottom: '10px', flexWrap: 'wrap' } },
        el('input', {
          type: 'text', placeholder: 'filter keys…', 'aria-label': 'Filter keys',
          value: S.q, onChange: function (ev) { S.q = ev.target.value; render(); },
          style: Object.assign({}, FIELD_STYLE, { flex: 1, minWidth: '160px', maxWidth: '320px' })
        }),
        el('span', { className: 'ks-muted', style: { fontSize: '11px', marginLeft: 'auto' } },
          pending ? pending + ' pending change' + (pending === 1 ? '' : 's') : 'no pending changes')),
      (S.error && S.activePath && !S.loading && !S.gate) ? el('div', { className: 'ks-card', style: { marginBottom: '10px', borderColor: 'var(--ks-bad-line, rgba(185,28,28,0.5))' } },
        el('p', { style: { color: 'var(--ks-bad, #fca5a5)', fontSize: '12px', margin: 0 } }, S.error)) : null,
      body(),
      actionPill());
  }
  return Page;
bundle_css: '.ks-react-page input, .ks-react-page select, .ks-react-page textarea { background: var(--ks-input-bg, rgba(0,0,0,0.4)) !important; border: 1px solid var(--ks-input-border, rgba(255,255,255,0.15)) !important; color: var(--ks-input-text, var(--ks-body, #e5e7eb)) !important; color-scheme: dark; }.ks-react-page select option { background: var(--ks-dropdown-bg, #1f2937) !important; color: var(--ks-input-text, #e5e7eb) !important; }.ks-react-page input::placeholder, .ks-react-page textarea::placeholder { color: var(--ks-input-placeholder, #6b7280) !important; opacity: 1; }.ks-react-page input:disabled, .ks-react-page select:disabled { opacity: 0.6; }'
icon_svg: <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
actions:
- description: Read server.properties in the instance root.
  name: read_props
  path: server.properties
  type: read_file
- description: Read mc/server.properties as a fallback location.
  name: read_props_mc
  path: mc/server.properties
  type: read_file
- description: Read /mc/server.properties as a fallback location.
  name: read_props_abs
  path: /mc/server.properties
  type: read_file
- command: set -- {{args}}; F="$1"; KV="$2"; K="${KV%%=*}"; V="${KV#*=}"; [ -n "$F" ] && [ -n "$K" ] && [ "$KV" != "$K" ] && touch "$F" && awk -v k="$K" -v v="$V" 'BEGIN{d=0} /^\r?$|^[ \t]*#/ {print;next} {p=index($0,"="); if(p>0){kk=substr($0,1,p-1); gsub(/^[ \t]+|[ \t]+$/, "", kk); if(kk==k){print k"="v; d=1; next}}} {print} END{if(!d) print k"="v}' "$F" > "$F.tmp" && mv "$F.tmp" "$F" && echo "saved $K"
  description: 'Set one server.properties key: runtime args are [file, key=value]. Preserves comments/order, appends missing keys.'
  name: set_prop
  open_args: true
  timeout: 30
  type: shell
- command: set -- {{args}}; A=${1##*/}; [ -n "$A" ] && mkdir -p backups && for F in server.properties mc/server.properties /mc/server.properties; do if [ -f "$F" ]; then cp "$F" "backups/$A" && echo "saved-backups/$A-from-$F"; break; fi; done
  description: Copy the active server.properties into backups/<name> (runtime filename, basename-jailed).
  name: backup_props
  open_args: true
  timeout: 30
  type: shell
