  \        + '</div>'\n        + '<label style=\"display:block;font-size:12px;color:var(--ks-muted);margin-top:12px\">Protocol<select id=\"pp-proto\" class=\"ks-input\" style=\"width:100%;box-sizing:border-box;margin-top:4px\"><option value=\"tcp\"' + (state.protocol === 'tcp' ? ' selected' : '') + '>tcp</option><option value=\"udp\"' + (state.protocol === 'udp' ? ' selected' : '') + '>udp</option></select></label>'\n        + '<label style=\"display:block;font-size:12px;color:var(--ks-muted);margin-top:12px\">IP (optional)<input id=\"pp-ip\" value=\"' + esc(state.ip) + '\" placeholder=\"0.0.0.0 or 127.0.0.1\" class=\"ks-input ks-mono\" style=\"width:100%;box-sizing:border-box;margin-top:4px\"></label>'\n        + '<div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:16px\"><button type=\"button\" data-x=\"1\" class=\"ks-btn\">Cancel</button><button type=\"button\" id=\"pp-ok\" class=\"ks-btn\" style=\"background:var(--ks-btn-bg,#fff);color:var(--ks-btn-text,#000)\">Add</button></div>'\n\
  \        + '</div></div>';\n    }\n    el('root').innerHTML = h;\n    wire();\n  }\n  function wire() {\n    var q = function (sel, fn) {\n      Array.prototype.forEach.call(document.querySelectorAll(sel), function (b) { b.addEventListener('click', fn); });\n    };\n    q('#pp-refresh', function () { load(); });\n    q('#pp-retry', function () { load(); });\n    var lim = el('pp-limit');\n    if (lim) lim.addEventListener('change', function () { state.limit = Number(lim.value) || 25; state.page = 1; render(); });\n    q('#pp-add', function () { state.modal = true; state.formError = ''; render(); var f = el('pp-host'); if (f) f.focus(); });\n    q('#pp-prev', function () { if (state.page > 1) { state.page--; render(); } });\n    q('#pp-next', function () { state.page++; render(); });\n    q('[data-del]', function () { var b = this; handleDelete(Number(b.getAttribute('data-del'))); });\n    q('[data-x]', function () { state.modal = false; state.formError = ''; render(); });\n    var ov =\
  \ document.querySelector('[data-overlay]');\n    if (ov) ov.addEventListener('click', function (ev) { if (ev.target === ov) { state.modal = false; state.formError = ''; render(); } });\n    var sync = function () {\n      var a = el('pp-host'), b = el('pp-container'), c = el('pp-proto'), d = el('pp-ip');\n      if (a) state.host = a.value;\n      if (b) state.container = b.value;\n      if (c) state.protocol = c.value;\n      if (d) state.ip = d.value;\n    };\n    var go = function () { sync(); handleAdd(); };\n    ['pp-host', 'pp-container', 'pp-proto', 'pp-ip'].forEach(function (id) {\n      var n = el(id);\n      if (!n) return;\n      n.addEventListener('input', sync);\n      n.addEventListener('change', sync);\n      n.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });\n    });\n    q('#pp-ok', go);\n  }\n  function start(s) {\n    sdk = s;\n    load();\n  }\n  if (window.KSPageSDK) start(window.KSPageSDK);\n  else window.addEventListener('ks-page-sdk-ready',\
  \ function () { start(window.KSPageSDK); }, { once: true });\n})();\n</script>"
