# Ports — instance page (YAML authoring format).
# Converted from ports.json; edit this file, not JSON.
# Multiline content uses `|` literal blocks (raw HTML/JS, no escaping);
# actions/sub_pages/components/configure are native YAML lists.
# See instance_pages/README.md for the field reference.
name: Ports
slug: ports
kind: custom
category: networking
type: network
description: 'Port allocations for this instance: host to container mappings with add and remove.'
content_type: html
content_html: |-
  {{component:ks_theme_head}}<div class="ks-page">
    <div id="root"><div class="ks-card"><div class="ks-skeleton-bar" style="height:12px;width:40%;margin-bottom:8px"></div><div class="ks-skeleton" style="height:12px;width:65%"></div></div></div>
  </div>
  <script>
  (function () {
    'use strict';
    var sdk = null;
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function toast(m, t) { try { sdk.toast(m, t || 'info'); } catch (e) {} }
    function ask(m) {
      try { if (sdk && typeof sdk.confirm === 'function') return sdk.confirm(m); } catch (e) {}
      return Promise.resolve(window.confirm(m));
    }
    function readOnly() {
      try {
        var c = window.KS_PAGE_CONFIG || {};
        return c.read_only === 'true' || c.read_only === '1' || c.read_only === 'on';
      } catch (e) { return false; }
    }
    function isIP(s) {
      var ip = String(s || '').trim();
      if (ip === '') return true;
      var v4 = /^(\d{1,3}\.){3}\d{1,3}$/;
      if (v4.test(ip)) {
        return ip.split('.').every(function (o) {
          var n = Number(o);
          return Number.isInteger(n) && n >= 0 && n <= 255;
        });
      }
      var v6 = /^[0-9a-fA-F:]+$/;
      if (v6.test(ip) && ip.indexOf(':') >= 0) {
        var parts = ip.split(':');
        if (parts.length > 8) return false;
        for (var i = 0; i < parts.length; i++) {
          if (parts[i] === '') continue;
          if (!/^[0-9a-fA-F]{1,4}$/.test(parts[i])) return false;
        }
        return true;
      }
      return false;
    }

    var state = {
      rows: [], loading: true, error: '', saving: false,
      limit: 25, page: 1,
      modal: false, host: '8080', container: '80', protocol: 'tcp', ip: '',
      formError: '', pillOff: false
    };

    function load() {
      state.loading = true; state.error = '';
      render();
      sdk.listPorts()
        .then(function (rows) { state.rows = Array.isArray(rows) ? rows : []; state.loading = false; render(); })
        .catch(function (e) { state.loading = false; state.error = (e && e.message) || 'Failed to load ports'; render(); });
    }
    function toInputs(rows) {
      return rows.map(function (p) {
        return { host: p.host_port, container: p.container_port, protocol: p.protocol, ip: p.ip || '' };
      });
    }
    function validPort(v) {
      var n = Number(v);
      return Number.isInteger(n) && n >= 1 && n <= 65535;
    }
    function handleAdd() {
      if (!validPort(state.host) || !validPort(state.container)) {
        state.formError = 'Ports must be 1-65535.';
        render(); return;
      }
      if (!isIP(state.ip)) { state.formError = 'IP is not valid.'; render(); return; }
      var next = toInputs(state.rows);
      next.push({ host: Number(state.host), container: Number(state.container), protocol: state.protocol, ip: state.ip.trim() });
      var seen = {};
      for (var i = 0; i < next.length; i++) {
        var k = (next[i].ip || '').trim() + ':' + next[i].host + '/' + next[i].protocol;
        if (seen[k]) { state.formError = 'Duplicate host+ip+protocol ' + k; render(); return; }
        seen[k] = true;
      }
      var prev = state.rows;
      state.rows = next.map(function (p, j) {
        return { id: 'tmp-' + j, instance_id: sdk.instance.id, host_port: p.host, container_port: p.container, protocol: p.protocol, ip: p.ip };
      });
      state.modal = false; state.saving = true; state.formError = '';
      render();
      sdk.savePorts(next)
        .then(function () { state.saving = false; toast('Ports updated', 'success'); load(); })
        .catch(function (e) {
          state.rows = prev; state.saving = false;
          var m = (e && e.message) || 'Failed to update ports';
          state.error = m; toast(m, 'error'); render();
        });
    }
    function handleDelete(idx) {
      var target = state.rows[idx];
      if (!target) return;
      ask('Remove ' + target.host_port + ' → ' + target.container_port + '/' + target.protocol + (target.ip ? ' (' + target.ip + ')' : '') + '?').then(function (ok) {
        if (!ok) return;
        var prev = state.rows;
        var nextInputs = toInputs(prev.filter(function (_, i) { return i !== idx; }));
        state.rows = prev.filter(function (_, i) { return i !== idx; });
        state.saving = true;
        render();
        sdk.savePorts(nextInputs)
          .then(function () { state.saving = false; toast('Port removed', 'success'); load(); })
          .catch(function (e) {
            state.rows = prev; state.saving = false;
            var m = (e && e.message) || 'Failed to update ports';
            state.error = m; toast(m, 'error'); render();
          });
      });
    }

    function el(id) { return document.getElementById(id); }
    /* ---- Action pill (top-right): panel PageActionsPill parity.
       ks-card ks-pill-anim ks-actions-pill shell, ks-pill-content with inline
       collapse geometry, ks-tab ks-pill-toggle with Pill-tab sizing vars,
       manual chevron toggle, auto-hide on scroll / outside-tap with idle
       restore, hover restores. Never invisible. ---- */
    function pillHtml(ro) {
      var off = state.pillOff ? ' ks-pill-collapsed' : '';
      var cs = off
        ? 'display:flex;align-items:center;gap:4px;max-width:0;opacity:0;transform:translateX(8px);pointer-events:none;visibility:hidden;overflow:hidden;padding:0;margin:0'
        : 'display:flex;align-items:center;gap:4px;max-width:800px;opacity:1;transform:none;overflow:visible';
      var ts = off ? '--ks-tab-px:4px' : '--ks-tab-px:var(--ks-pill-tab-px,10px)';
      var h = '<div id="pp-pill-outer" style="position:fixed;top:12px;right:12px;z-index:40">'
        + '<div id="pp-pill" class="ks-card ks-pill-anim ks-actions-pill' + off + '" role="toolbar" aria-label="Port actions" style="display:flex;align-items:center;gap:4px;padding:6px;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.40);--ks-card-padding:6px">'
        + '<div class="ks-pill-content" style="' + cs + '" aria-hidden="' + (!!off) + '">'
        + '<select id="pp-limit" title="Rows per page" aria-label="Rows per page" style="background:var(--ks-input-bg);border:1px solid var(--ks-input-border);color:var(--ks-body);border-radius:6px;font-size:12px;padding:5px 6px">'
        + [10, 25, 50, 100].map(function (n) { return '<option value="' + n + '"' + (n === state.limit ? ' selected' : '') + '>' + n + '</option>'; }).join('')
        + '</select>'
        + (ro ? '' : '<button type="button" id="pp-add" title="Add port" aria-label="Add port" class="ks-tab" style="padding:5px 10px;font-size:13px"' + (state.saving ? ' disabled style="padding:5px 10px;font-size:13px;opacity:.4"' : '') + '><span style="display:inline-flex;align-items:center;gap:6px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add port</span></button>')
        + '<button type="button" id="pp-refresh" title="Refresh" aria-label="Refresh" class="ks-btn-header ks-icon-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>'
        + '</div>'
        + '<button type="button" id="pp-pill-toggle" aria-label="' + (state.pillOff ? 'Show actions' : 'Hide actions') + '" aria-expanded="' + (!state.pillOff) + '" title="' + (state.pillOff ? 'Show actions' : 'Hide actions') + '" class="ks-tab ks-pill-toggle" style="display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;' + ts + ';--ks-tab-py:var(--ks-pill-tab-py,5px);--ks-tab-font:var(--ks-pill-tab-font,13px)">' + (state.pillOff ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>') + '</button>'
        + '</div></div>';
      return h;
    }
    function render() {
      var ro = readOnly();
      var totalPages = Math.max(1, Math.ceil(state.rows.length / state.limit));
      if (state.page > totalPages) state.page = totalPages;
      var slice = state.rows.slice((state.page - 1) * state.limit, state.page * state.limit);
      var h = pillHtml(ro);
      if (state.loading && !state.rows.length) {
        h += '<div class="ks-card"><div class="ks-skeleton-bar" style="height:12px;width:40%;margin-bottom:8px"></div><div class="ks-skeleton" style="height:12px;width:65%"></div></div>';
      } else if (!state.loading && state.error && !state.rows.length) {
        h += '<div class="ks-card" style="text-align:center;padding:32px 16px"><p style="font-size:14px;color:var(--ks-heading);margin:0 0 4px">Failed to load ports</p><p style="font-size:12px;color:var(--ks-muted);margin:0 0 12px">' + esc(state.error) + '</p><button type="button" id="pp-retry" class="ks-btn">Retry</button></div>';
      } else {
        if (state.error) h += '<div class="ks-card" style="border-color:var(--ks-bad-line);color:var(--ks-bad);font-size:12px;margin-bottom:12px">' + esc(state.error) + '</div>';
        if (ro) h += '<div class="ks-card" style="font-size:13px;color:var(--ks-muted);margin-bottom:12px">Read-only — this template disables port editing for the page.</div>';
        var rows = '';
        for (var i = 0; i < slice.length; i++) {
          (function (p, ri) {
            rows += '<tr style="border-top:1px solid var(--ks-card-border)"><td class="ks-mono" style="padding:8px 12px;color:var(--ks-heading)">' + esc(p.host_port) + '</td>'
              + '<td class="ks-mono" style="padding:8px 12px;color:var(--ks-heading)">' + esc(p.container_port) + '</td>'
              + '<td style="padding:8px 12px"><span class="ks-badge" style="text-transform:uppercase">' + esc(p.protocol) + '</span></td>'
              + '<td class="ks-mono" style="padding:8px 12px;color:var(--ks-body)">' + esc(p.ip || '0.0.0.0') + '</td>'
              + '<td style="padding:8px 12px;text-align:right">' + (ro ? '<span style="font-size:12px;color:var(--ks-muted)">—</span>' : '<button type="button" data-del="' + ri + '" class="ks-btn ks-btn-red" style="padding:4px 12px;font-size:12px">Remove</button>') + '</td></tr>';
          })(slice[i], (state.page - 1) * state.limit + i);
        }
        if (!slice.length) rows = '<tr><td colspan="5" style="padding:32px 12px;text-align:center;color:var(--ks-muted);font-size:13px">No ports allocated. Click Add port to create one.</td></tr>';
        h += '<div class="ks-card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table style="width:100%;font-size:13px"><thead><tr style="text-align:left;color:var(--ks-muted);border-bottom:1px solid var(--ks-card-border)"><th style="padding:8px 12px;font-weight:500">Host</th><th style="padding:8px 12px;font-weight:500">Container</th><th style="padding:8px 12px;font-weight:500">Protocol</th><th style="padding:8px 12px;font-weight:500">IP</th><th style="padding:8px 12px;font-weight:500;text-align:right">Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
        if (totalPages > 1) {
          h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--ks-card-border);font-size:12px;color:var(--ks-muted)"><span>Page ' + state.page + ' / ' + totalPages + '</span><span style="display:flex;gap:4px"><button type="button" id="pp-prev" class="ks-btn" style="padding:4px 10px;font-size:12px"' + (state.page <= 1 ? ' disabled style="padding:4px 10px;font-size:12px;opacity:.4"' : '') + '>Prev</button><button type="button" id="pp-next" class="ks-btn" style="padding:4px 10px;font-size:12px"' + (state.page >= totalPages ? ' disabled style="padding:4px 10px;font-size:12px;opacity:.4"' : '') + '>Next</button></span></div>';
        }
        h += '</div>';
      }
      if (state.modal) {
        h += '<div data-overlay="1" style="position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.60);padding:16px">'
          + '<div class="ks-card" style="width:100%;max-width:28rem;max-height:90vh;overflow-y:auto"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:16px;font-weight:600;color:var(--ks-heading);margin:0">Add port allocation</h3>'
          + '<button type="button" data-x="1" aria-label="Close" style="border:none;background:transparent;color:var(--ks-muted);cursor:pointer;padding:4px">✕</button></div>'
          + (state.formError ? '<p style="font-size:12px;color:var(--ks-bad);margin:0 0 10px">' + esc(state.formError) + '</p>' : '')
          + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
          + '<label style="display:block;font-size:12px;color:var(--ks-muted)">Host port<input id="pp-host" type="number" min="1" max="65535" value="' + esc(state.host) + '" class="ks-input ks-mono" style="width:100%;box-sizing:border-box;margin-top:4px"></label>'
          + '<label style="display:block;font-size:12px;color:var(--ks-muted)">Container port<input id="pp-container" type="number" min="1" max="65535" value="' + esc(state.container) + '" class="ks-input ks-mono" style="width:100%;box-sizing:border-box;margin-top:4px"></label>'
          + '</div>'
          + '<label style="display:block;font-size:12px;color:var(--ks-muted);margin-top:12px">Protocol<select id="pp-proto" class="ks-input" style="width:100%;box-sizing:border-box;margin-top:4px"><option value="tcp"' + (state.protocol === 'tcp' ? ' selected' : '') + '>tcp</option><option value="udp"' + (state.protocol === 'udp' ? ' selected' : '') + '>udp</option></select></label>'
          + '<label style="display:block;font-size:12px;color:var(--ks-muted);margin-top:12px">IP (optional)<input id="pp-ip" value="' + esc(state.ip) + '" placeholder="0.0.0.0 or 127.0.0.1" class="ks-input ks-mono" style="width:100%;box-sizing:border-box;margin-top:4px"></label>'
          + '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button type="button" data-x="1" class="ks-btn">Cancel</button><button type="button" id="pp-ok" class="ks-btn" style="background:var(--ks-btn-bg,#fff);color:var(--ks-btn-text,#000)">Add</button></div>'
          + '</div></div>';
      }
      el('root').innerHTML = h;
      wire();
    }
    function wire() {
      var q = function (sel, fn) {
        Array.prototype.forEach.call(document.querySelectorAll(sel), function (b) { b.addEventListener('click', fn); });
      };
      q('#pp-refresh', function () { load(); });
      q('#pp-retry', function () { load(); });
      var lim = el('pp-limit');
      if (lim) lim.addEventListener('change', function () { state.limit = Number(lim.value) || 25; state.page = 1; render(); });
      q('#pp-add', function () { state.modal = true; state.formError = ''; render(); var f = el('pp-host'); if (f) f.focus(); });
      q('#pp-prev', function () { if (state.page > 1) { state.page--; render(); } });
      q('#pp-next', function () { state.page++; render(); });
      q('[data-del]', function () { var b = this; handleDelete(Number(b.getAttribute('data-del'))); });
      q('[data-x]', function () { state.modal = false; state.formError = ''; render(); });
      var ov = document.querySelector('[data-overlay]');
      if (ov) ov.addEventListener('click', function (ev) { if (ev.target === ov) { state.modal = false; state.formError = ''; render(); } });
      var sync = function () {
        var a = el('pp-host'), b = el('pp-container'), c = el('pp-proto'), d = el('pp-ip');
        if (a) state.host = a.value;
        if (b) state.container = b.value;
        if (c) state.protocol = c.value;
        if (d) state.ip = d.value;
      };
      var go = function () { sync(); handleAdd(); };
      ['pp-host', 'pp-container', 'pp-proto', 'pp-ip'].forEach(function (id) {
        var n = el(id);
        if (!n) return;
        n.addEventListener('input', sync);
        n.addEventListener('change', sync);
        n.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
      });
      q('#pp-ok', go);
      q('#pp-pill-toggle', function () { showPill(); setPillOff(!state.pillOff); });
      // Hover restore rides on the CURRENT pill node (render() recreates it).
      var curPill = el('pp-pill');
      if (curPill && !curPill.getAttribute('data-hover')) {
        curPill.setAttribute('data-hover', '1');
        curPill.addEventListener('mouseenter', function () { showPill(); if (state.pillOff) setPillOff(false); });
      }
      wirePillAutoHide();
    }
    var pillTimer = null;
    function showPill() {
      if (pillTimer) { window.clearTimeout(pillTimer); pillTimer = null; }
    }
    var pillAutoWired = false;
    // Chevron glyphs for the live toggle (resolved at bake time).
    var CHEV_L = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>';
    var CHEV_R = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
    // Live collapse: update the EXISTING pill nodes in place so the baked
    // 300ms transitions run. A full render() rebuild would snap instantly.
    function setPillOff(off) {
      state.pillOff = off;
      var host = el('pp-pill');
      if (!host) return;
      if (off) host.classList.add('ks-pill-collapsed');
      else host.classList.remove('ks-pill-collapsed');
      var c = host.querySelector('.ks-pill-content');
      if (c) {
        if (off) { c.style.maxWidth = '0'; c.style.opacity = '0'; c.style.transform = 'translateX(8px)'; c.style.pointerEvents = 'none'; c.style.visibility = 'hidden'; c.style.overflow = 'hidden'; }
        else { c.style.maxWidth = '800px'; c.style.opacity = '1'; c.style.transform = 'none'; c.style.pointerEvents = 'auto'; c.style.visibility = 'visible'; c.style.overflow = 'visible'; }
        c.setAttribute('aria-hidden', off ? 'true' : 'false');
      }
      var tg = document.getElementById('pp-pill-toggle');
      if (tg) {
        tg.setAttribute('aria-label', off ? 'Show actions' : 'Hide actions');
        tg.setAttribute('aria-expanded', off ? 'false' : 'true');
        tg.setAttribute('title', off ? 'Show actions' : 'Hide actions');
        tg.style.setProperty('--ks-tab-px', off ? '4px' : 'var(--ks-pill-tab-px,10px)');
        tg.innerHTML = off ? CHEV_L : CHEV_R;
      }
    }
    // Pill auto-hide parity with PageActionsPill: scroll / outside-tap
    // collapses to the toggle, idle 2.5s restore. Document listeners bound
    // once; the pill node is re-queried every time (render() recreates it).
    function wirePillAutoHide() {
      if (pillAutoWired) return;
      pillAutoWired = true;
      try {
          var scheduleShow = function () {
            if (pillTimer) window.clearTimeout(pillTimer);
            pillTimer = window.setTimeout(function () { setPillOff(false); }, 2500);
          };
          document.addEventListener('scroll', function () {
            var p = document.getElementById('pp-pill');
            if (p && document.activeElement && p.contains(document.activeElement)) return;
            if (!state.pillOff) setPillOff(true);
            scheduleShow();
          }, true);
          document.addEventListener('pointerdown', function (ev) {
            var p = document.getElementById('pp-pill');
            if (!p) return;
            var path = (typeof ev.composedPath === 'function') ? ev.composedPath() : [];
            var inside = path.indexOf(p) >= 0 || (ev.target && p.contains(ev.target));
            if (!inside && !state.pillOff) setPillOff(true);
          });
          document.addEventListener('focusin', function (ev) {
            var p = document.getElementById('pp-pill');
            if (p && ev.target && p.contains(ev.target)) { showPill(); if (state.pillOff) setPillOff(false); }
          });
      } catch (e) {}
    }
    function start(s) {
      sdk = s;
      load();
    }
    if (window.KSPageSDK) start(window.KSPageSDK);
    else window.addEventListener('ks-page-sdk-ready', function () { start(window.KSPageSDK); }, { once: true });
  })();
  </script>
icon_svg: <rect x="2" y="7" width="20" height="8" rx="2"/><path d="M6 7v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/><path d="M6 15v2a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-2"/>
configure:
- name: read_only
  label: Read-only
  description: Hide Add and Remove — the port table stays readable.
  default: 'false'
  user_viewable: true
  user_editable: true
  required: false
  rule: ''
  display: toggle
  options: ''
  append: false
  prepend: ''
  append_value: ''
