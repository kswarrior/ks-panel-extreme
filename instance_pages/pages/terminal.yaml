  type: html
  description: 'Pill toggle: hide actions.'
  content: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
icon_svg: <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
configure:
- name: allow_multi
  label: Allow multiple terminals
  description: Operators may add more terminal panes together on the Terminal page.
  default: 'true'
  user_viewable: true
  user_editable: true
  required: false
  rule: ''
  display: toggle
  options: ''
  append: false
  prepend: ''
  append_value: ''
- name: max_terminals
  label: Max terminals
  description: Cap on simultaneous panes (empty = unlimited).
  default: '4'
  user_viewable: true
  user_editable: true
  required: false
  rule: ^[0-9]*$
  display: number
  options: ''
  append: false
  prepend: ''
  append_value: ''
- name: default_stop_on_exit
  label: Stop pane when process exits
  description: New panes lock input once the bound process exits.
  default: 'true'
  user_viewable: true
  user_editable: true
  required: false
  rule: ''
  display: toggle
  options: ''
  append: false
  prepend: ''
  append_value: ''
- name: default_allow_input
  label: New-pane input default
  description: Whether new panes accept typed input (all = every pane, allowlist = only panes bound to a terminal ID, disabled = none).
  default: all
  user_viewable: true
  user_editable: true
  required: false
  rule: ''
  display: select
  options: all, allowlist, disabled
  append: false
  prepend: ''
  append_value: ''
- name: default_timeout_s
  label: New-pane timeout (seconds)
  description: Attach budget for new panes (empty = no limit).
  default: ''
  user_viewable: true
  user_editable: true
  required: false
  rule: ^[0-9]*$
  display: number
  options: ''
  append: false
  prepend: ''
  append_value: ''
- name: input_mode
  label: Input method
  description: Direct = type straight into the terminal. Box = output-only terminal with an input + Send row below.
  default: direct
  user_viewable: true
  user_editable: true
  required: false
  rule: ''
  display: select
  options: direct, box
  append: false
  prepend: ''
  append_value: ''
- name: prompt_style
  label: Prompt line (direct mode)
  description: Linux-like prompt line above each pane. Display-only, never reaches the shell.
  default: none
  user_viewable: true
  user_editable: true
  required: false
  rule: ''
  display: select
  options: none, host_path, host, path
  append: false
  prepend: ''
  append_value: ''
- name: shortcuts_enabled
  label: Shortcuts
  description: Pre-made command buttons on the Terminal page.
  default: 'false'
  user_viewable: true
  user_editable: true
  required: false
  rule: ''
  display: toggle
  options: ''
  append: false
  prepend: ''
  append_value: ''
- name: shortcuts
  label: Shortcuts list
  description: 'JSON array of {label, command}. Commands may carry {{VAR}} / ${VAR} / $(VAR) placeholders: picking asks the operator for each value.'
  default: '[]'
  user_viewable: true
  user_editable: true
  required: false
  rule: ''
  display: text
  options: ''
  append: false
  prepend: ''
  append_value: ''
- name: default_terminals
  label: Default terminals
  description: JSON array of {name, id} panes opened automatically. Empty id = plain shell, otherwise must match an action/install/startup terminal ID for its live console.
  default: '[]'
  user_viewable: true
  user_editable: true
  required: false
  rule: ''
  display: text
  options: ''
  append: false
  prepend: ''
  append_value: ''
