    }
    function wire() {
      var q = function (sel, fn) {
        Array.prototype.forEach.call(document.querySelectorAll(sel), function (b) { b.addEventListener('click', fn); });
      };
      q('#pp-refresh', function () { load(); });
      q('#pp-retry', function () { load(); });
      var lim = el('pp-limit');
      if (lim) lim.addEventListener('change', function () { state.limit = Number(lim.value) || 25; state.page = 1; render(); });
      q('#pp-add', function () { state.modal = true; state.formError = ''; render(); var f = el('pp-host'); if (f) f.focus(); });
      q('#pp-prev', function () { if (state.page > 1) { state.page--; render(); } });
      q('#pp-next', function () { state.page++; render(); });
      q('[data-del]', function () { var b = this; handleDelete(Number(b.getAttribute('data-del'))); });
