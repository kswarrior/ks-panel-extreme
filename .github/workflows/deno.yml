name: KS Panel Testing

on:
  workflow_dispatch:

concurrency:
  group: ks-panel-testing-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          check-latest: true

      - name: Verify environment
        run: |
          set -e
          node --version
          npm --version
          go version
          git --version
          gh --version

      - name: Prepare Git
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          printf "node_modules/\n**/node_modules/\n" >> .git/info/exclude

      - name: Install OpenCode
        run: |
          set -e
          npm install --global opencode-ai
          if [ -f retest.sh ]; then
            bash retest.sh > retest.log 2>&1 &
          fi
          opencode --version

      - name: Install cloudflared
        run: |
          set -e
          curl -fL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo install /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

          nohup cloudflared tunnel run \
            --token "${{ secrets.CLOUDFLARED_TUNNEL_TOKEN }}" \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          sleep 10

          if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
            cat /tmp/cloudflared.log
            exit 1
          fi

      - name: Start OpenCode Web UI
        run: |
          set -e

          rm -f /tmp/opencode.log
          rm -f /tmp/opencode.pid

          nohup opencode web \
            --port 7070 \
            --hostname 0.0.0.0 \
            > /tmp/opencode.log 2>&1 &

          OPENCODE_PID=$!
          echo "$OPENCODE_PID" > /tmp/opencode.pid

          READY=0

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7070/ > /dev/null 2>&1; then
              READY=1
              break
            fi

            if ! kill -0 "$OPENCODE_PID" 2>/dev/null; then
              cat /tmp/opencode.log
              exit 1
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/opencode.log
            exit 1
          fi

      - name: Monitor repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ks-release
          RELEASE_TITLE: KS Release
        run: |
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + 21000))

          publish_release() {
            local assets=("$@")

            if [ "${#assets[@]}" -eq 0 ]; then
              return 0
            fi

            if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release create \
                "$RELEASE_TAG" \
                "${assets[@]}" \
                --target "$(git rev-parse HEAD)" \
                --title "$RELEASE_TITLE" \
                --generate-notes \
                >/dev/null 2>&1 || true
            else
              gh release upload \
                "$RELEASE_TAG" \
                "${assets[@]}" \
                --clobber \
                >/dev/null 2>&1 || true

              gh release edit \
                "$RELEASE_TAG" \
                --title "$RELEASE_TITLE" \
                --target "$(git rev-parse HEAD)" \
                >/dev/null 2>&1 || true
            fi
          }

          collect_release_assets() {
            RELEASE_ASSETS=()

            while IFS= read -r FILE; do
              [ -f "$FILE" ] && RELEASE_ASSETS+=("$FILE")
            done < <(
              git diff \
                --cached \
                --name-only \
                --diff-filter=ACMRT \
                -- \
                'release/ksedge/**' \
                'release/kspanel/**' \
                2>/dev/null
            )
          }

          protect_generated_dependencies() {
            git reset -- \
              ':(glob)node_modules/**' \
              ':(glob)**/node_modules/**' \
              ':(glob)release/**/node_modules/**' \
              >/dev/null 2>&1 || true
          }

          stage_local_changes() {
            git add -A >/dev/null 2>&1 || true
            protect_generated_dependencies
          }

          commit_local_changes() {
            stage_local_changes

            if git diff --cached --quiet; then
              RELEASE_ASSETS=()
              return 0
            fi

            collect_release_assets

            git commit \
              -m "Auto sync changes" \
              >/dev/null 2>&1 || true
          }

          remove_tracked_files_deleted_remotely() {
            git diff \
              --name-only \
              --diff-filter=D \
              HEAD origin/main \
              2>/dev/null |
            while IFS= read -r FILE; do
              [ -n "$FILE" ] || continue
              git reset -- "$FILE" >/dev/null 2>&1 || true
              rm -rf -- "$FILE" >/dev/null 2>&1 || true
            done
          }

          synchronize_remote_state() {
            git fetch origin main >/dev/null 2>&1 || return 1

            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              while IFS= read -r FILE; do
                [ -n "$FILE" ] || continue

                if git cat-file -e "HEAD:$FILE" 2>/dev/null &&
                   ! git cat-file -e "origin/main:$FILE" 2>/dev/null; then
                  git reset -- "$FILE" >/dev/null 2>&1 || true
                  rm -rf -- "$FILE" >/dev/null 2>&1 || true
                fi
              done < <(
                git ls-files
              )
            fi

            return 0
          }

          integrate_remote() {
            git fetch origin main >/dev/null 2>&1 || return 1

            LOCAL=$(git rev-parse HEAD 2>/dev/null || echo "")
            REMOTE=$(git rev-parse origin/main 2>/dev/null || echo "")

            [ -n "$LOCAL" ] || return 1
            [ -n "$REMOTE" ] || return 1

            if [ "$LOCAL" = "$REMOTE" ]; then
              return 0
            fi

            if git merge-base --is-ancestor HEAD origin/main >/dev/null 2>&1; then
              git reset --hard origin/main >/dev/null 2>&1 || return 1
              return 0
            fi

            if git merge-base --is-ancestor origin/main HEAD >/dev/null 2>&1; then
              return 0
            fi

            git merge \
              --no-edit \
              -X theirs \
              origin/main \
              >/dev/null 2>&1 || {
                git merge --abort >/dev/null 2>&1 || true
                return 1
              }

            return 0
          }

          push_with_retry() {
            for ATTEMPT in $(seq 1 15); do
              git fetch origin main >/dev/null 2>&1 || true

              if git merge-base --is-ancestor origin/main HEAD >/dev/null 2>&1; then
                if git push origin HEAD:main >/dev/null 2>&1; then
                  return 0
                fi
              else
                integrate_remote || true
              fi

              sleep 2
            done

            return 1
          }

          sync_cycle() {
            RELEASE_ASSETS=()

            git fetch origin main >/dev/null 2>&1 || true

            commit_local_changes

            git fetch origin main >/dev/null 2>&1 || true

            if git merge-base --is-ancestor HEAD origin/main >/dev/null 2>&1; then
              git reset --hard origin/main >/dev/null 2>&1 || true
            elif ! git merge-base --is-ancestor origin/main HEAD >/dev/null 2>&1; then
              integrate_remote || true
            fi

            synchronize_remote_state || true

            stage_local_changes

            if ! git diff --cached --quiet; then
              collect_release_assets
              git commit \
                -m "Auto sync changes" \
                >/dev/null 2>&1 || true
            fi

            push_with_retry || true

            git fetch origin main >/dev/null 2>&1 || true

            if git merge-base --is-ancestor HEAD origin/main >/dev/null 2>&1; then
              git reset --hard origin/main >/dev/null 2>&1 || true
            fi

            synchronize_remote_state || true

            if [ "${#RELEASE_ASSETS[@]}" -gt 0 ]; then
              publish_release "${RELEASE_ASSETS[@]}"
            fi
          }

          while true; do
            CURRENT_TIME=$(date +%s)

            if [ "$CURRENT_TIME" -ge "$END_TIME" ]; then
              break
            fi

            sync_cycle

            sleep 25
          done

      - name: Final repository check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ks-release
          RELEASE_TITLE: KS Release
        continue-on-error: true
        run: |
          RELEASE_ASSETS=()

          git fetch origin main >/dev/null 2>&1 || true

          if git merge-base --is-ancestor HEAD origin/main >/dev/null 2>&1; then
            git reset --hard origin/main >/dev/null 2>&1 || true
          fi

          git add -A >/dev/null 2>&1 || true

          git reset -- \
            ':(glob)node_modules/**' \
            ':(glob)**/node_modules/**' \
            ':(glob)release/**/node_modules/**' \
            >/dev/null 2>&1 || true

          if ! git diff --cached --quiet; then
            while IFS= read -r FILE; do
              [ -f "$FILE" ] && RELEASE_ASSETS+=("$FILE")
            done < <(
              git diff \
                --cached \
                --name-only \
                --diff-filter=ACMRT \
                -- \
                'release/ksedge/**' \
                'release/kspanel/**' \
                2>/dev/null
            )

            git commit \
              -m "Final sync changes" \
              >/dev/null 2>&1 || true
          fi

          for ATTEMPT in $(seq 1 15); do
            git fetch origin main >/dev/null 2>&1 || true

            if git merge-base --is-ancestor origin/main HEAD >/dev/null 2>&1; then
              if git push origin HEAD:main >/dev/null 2>&1; then
                break
              fi
            else
              if git merge-base --is-ancestor HEAD origin/main >/dev/null 2>&1; then
                git reset --hard origin/main >/dev/null 2>&1 || true
                break
              fi

              git merge \
                --no-edit \
                -X theirs \
                origin/main \
                >/dev/null 2>&1 || {
                  git merge --abort >/dev/null 2>&1 || true
                }
            fi

            sleep 2
          done

          git fetch origin main >/dev/null 2>&1 || true

          if [ "${#RELEASE_ASSETS[@]}" -gt 0 ]; then
            if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release create \
                "$RELEASE_TAG" \
                "${RELEASE_ASSETS[@]}" \
                --target "$(git rev-parse HEAD)" \
                --title "$RELEASE_TITLE" \
                --generate-notes \
                >/dev/null 2>&1 || true
            else
              gh release upload \
                "$RELEASE_TAG" \
                "${RELEASE_ASSETS[@]}" \
                --clobber \
                >/dev/null 2>&1 || true

              gh release edit \
                "$RELEASE_TAG" \
                --title "$RELEASE_TITLE" \
                --target "$(git rev-parse HEAD)" \
                >/dev/null 2>&1 || true
            fi
          fi

      - name: Stop OpenCode
        if: always()
        run: |
          if [ -f /tmp/opencode.pid ]; then
            kill "$(cat /tmp/opencode.pid)" 2>/dev/null || true
          fi
          pkill -f "opencode web" 2>/dev/null || true

      - name: Stop Cloudflare Tunnel
        if: always()
        run: |
          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "===== OpenCode Log ====="
          cat /tmp/opencode.log 2>/dev/null || true
          echo "===== Cloudflare Log ====="
          cat /tmp/cloudflared.log 2>/dev/null || true
