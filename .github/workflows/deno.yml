name: KS Panel Testing

on:
  workflow_dispatch:

concurrency:
  group: ks-panel-testing-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          check-latest: true

      - name: Verify environment
        run: |
          set -e

          node --version
          npm --version
          go version
          git --version
          gh --version

      - name: Prepare Git
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          git checkout -B main origin/main

          printf "node_modules/\n**/node_modules/\n" >> .git/info/exclude

          echo "Git workspace ready."

      - name: Install OpenCode & start panel (test)
        run: |
          set -e

          npm install --global opencode-ai
          bash retest.sh || true
          echo "OpenCode:"
          opencode --version

      - name: Install cloudflared
        run: |
          set -e

          curl -fL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared

          chmod +x /tmp/cloudflared

          sudo install /tmp/cloudflared /usr/local/bin/cloudflared

          cloudflared --version

          nohup cloudflared tunnel run \
            --token "eyJhIjoiZTJkZjY3MDI5ZWZlZTBmY2JhM2ExMjNjN2VmNTcxNTAiLCJ0IjoiMGQ2Yzk5YjQtMGUzZC00NzEyLWFmNDctNzM0MGU5YTEyOGE3IiwicyI6IlkyVTNOelV5WmpBdFl6SmpOeTAwTjJZMExUbGpNMk10T0dJelltRmtOREk1T1dOaCJ9" \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          sleep 10

          if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
            echo "Cloudflare Tunnel failed to start."
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "Cloudflare Tunnel is running."

      - name: Start OpenCode Web UI
        run: |
          set -e

          rm -f /tmp/opencode.log
          rm -f /tmp/opencode.pid

          nohup opencode web \
            --port 7070 \
            --hostname 0.0.0.0 \
            > /tmp/opencode.log 2>&1 &

          OPENCODE_PID=$!

          echo "$OPENCODE_PID" > /tmp/opencode.pid

          echo "Waiting for OpenCode Web UI..."

          READY=0

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7070/ > /dev/null 2>&1; then
              READY=1
              break
            fi

            if ! kill -0 "$OPENCODE_PID" 2>/dev/null; then
              echo "OpenCode stopped unexpectedly."
              cat /tmp/opencode.log
              exit 1
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "OpenCode Web UI did not become ready."
            cat /tmp/opencode.log
            exit 1
          fi

          echo "OpenCode Web UI is running on port 7070."

      - name: Monitor repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + 21000))

          RELEASE_TAG="ks-release"
          RELEASE_TITLE="KS Release"

          echo "Repository monitor started."
          echo "Monitoring for 5 hours 50 minutes."
          echo "Check interval: 5 seconds."

          while true; do

            CURRENT_TIME=$(date +%s)

            if [ "$CURRENT_TIME" -ge "$END_TIME" ]; then
              echo "Repository monitoring completed."
              break
            fi

            git fetch origin main

            LOCAL_COMMIT=$(git rev-parse HEAD)
            REMOTE_COMMIT=$(git rev-parse origin/main)

            git status --porcelain --untracked-files=all > /tmp/git-status.txt

            grep -vE '(^|/)(node_modules)(/|$)' \
              /tmp/git-status.txt \
              > /tmp/git-status-clean.txt || true

            if [ -s /tmp/git-status-clean.txt ]; then
              HAS_LOCAL_CHANGES=1
            else
              HAS_LOCAL_CHANGES=0
            fi

            if [ "$LOCAL_COMMIT" != "$REMOTE_COMMIT" ]; then

              if [ "$HAS_LOCAL_CHANGES" -eq 0 ]; then

                git reset --hard origin/main

                git clean -fd \
                  -e node_modules \
                  -e '*/node_modules'

                echo "Remote changes loaded into workspace."

              else

                echo "Local changes detected."

                git add -A

                git reset -- \
                  ':(glob)node_modules/**' \
                  ':(glob)**/node_modules/**' \
                  2>/dev/null || true

                if git diff --cached --quiet; then

                  git reset --hard origin/main

                  git clean -fd \
                    -e node_modules \
                    -e '*/node_modules'

                  echo "Remote changes loaded into workspace."

                else

                  RELEASE_ASSETS=()

                  while IFS= read -r FILE; do
                    if [ -f "$FILE" ]; then
                      RELEASE_ASSETS+=("$FILE")
                    fi
                  done < <(
                    git diff \
                      --cached \
                      --name-only \
                      --diff-filter=ACMRT \
                      -- \
                      'release/ksedge/**' \
                      'release/kspanel/**'
                  )

                  git commit -m "Auto sync changes"

                  git fetch origin main

                  git rebase origin/main

                  PUSHED=0

                  for ATTEMPT in 1 2 3 4 5; do

                    if git push origin main:main; then
                      PUSHED=1
                      break
                    fi

                    git fetch origin main

                    git rebase origin/main

                    sleep 2

                  done

                  if [ "$PUSHED" -ne 1 ]; then
                    echo "ERROR: Push failed after 5 attempts."
                    exit 1
                  fi

                  echo "Changes committed and pushed successfully."

                  if [ "${#RELEASE_ASSETS[@]}" -gt 0 ]; then

                    if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

                      gh release upload \
                        "$RELEASE_TAG" \
                        "${RELEASE_ASSETS[@]}" \
                        --clobber

                      gh release edit \
                        "$RELEASE_TAG" \
                        --title "$RELEASE_TITLE" \
                        --target "$(git rev-parse HEAD)"

                      echo "GitHub Release updated."

                    else

                      gh release create \
                        "$RELEASE_TAG" \
                        "${RELEASE_ASSETS[@]}" \
                        --target "$(git rev-parse HEAD)" \
                        --title "$RELEASE_TITLE" \
                        --generate-notes

                      echo "GitHub Release created."

                    fi

                  fi

                fi

              fi

            else

              if [ "$HAS_LOCAL_CHANGES" -eq 1 ]; then

                echo "Local changes detected."

                git add -A

                git reset -- \
                  ':(glob)node_modules/**' \
                  ':(glob)**/node_modules/**' \
                  2>/dev/null || true

                if ! git diff --cached --quiet; then

                  RELEASE_ASSETS=()

                  while IFS= read -r FILE; do
                    if [ -f "$FILE" ]; then
                      RELEASE_ASSETS+=("$FILE")
                    fi
                  done < <(
                    git diff \
                      --cached \
                      --name-only \
                      --diff-filter=ACMRT \
                      -- \
                      'release/ksedge/**' \
                      'release/kspanel/**'
                  )

                  git commit -m "Auto sync changes"

                  git fetch origin main

                  git rebase origin/main

                  PUSHED=0

                  for ATTEMPT in 1 2 3 4 5; do

                    if git push origin main:main; then
                      PUSHED=1
                      break
                    fi

                    git fetch origin main

                    git rebase origin/main

                    sleep 2

                  done

                  if [ "$PUSHED" -ne 1 ]; then
                    echo "ERROR: Push failed after 5 attempts."
                    exit 1
                  fi

                  echo "Changes committed and pushed successfully."

                  if [ "${#RELEASE_ASSETS[@]}" -gt 0 ]; then

                    if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

                      gh release upload \
                        "$RELEASE_TAG" \
                        "${RELEASE_ASSETS[@]}" \
                        --clobber

                      gh release edit \
                        "$RELEASE_TAG" \
                        --title "$RELEASE_TITLE" \
                        --target "$(git rev-parse HEAD)"

                      echo "GitHub Release updated."

                    else

                      gh release create \
                        "$RELEASE_TAG" \
                        "${RELEASE_ASSETS[@]}" \
                        --target "$(git rev-parse HEAD)" \
                        --title "$RELEASE_TITLE" \
                        --generate-notes

                      echo "GitHub Release created."

                    fi

                  fi

                fi

              fi

            fi

            sleep 5

          done

      - name: Final repository check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          RELEASE_TAG="ks-release"
          RELEASE_TITLE="KS Release"

          git fetch origin main

          git status --porcelain --untracked-files=all > /tmp/final-status.txt

          grep -vE '(^|/)(node_modules)(/|$)' \
            /tmp/final-status.txt \
            > /tmp/final-status-clean.txt || true

          if [ ! -s /tmp/final-status-clean.txt ]; then
            exit 0
          fi

          echo "Final local changes detected."

          git add -A

          git reset -- \
            ':(glob)node_modules/**' \
            ':(glob)**/node_modules/**' \
            2>/dev/null || true

          if git diff --cached --quiet; then
            exit 0
          fi

          RELEASE_ASSETS=()

          while IFS= read -r FILE; do
            if [ -f "$FILE" ]; then
              RELEASE_ASSETS+=("$FILE")
            fi
          done < <(
            git diff \
              --cached \
              --name-only \
              --diff-filter=ACMRT \
              -- \
              'release/ksedge/**' \
              'release/kspanel/**'
          )

          git commit -m "Final sync changes"

          git fetch origin main

          git rebase origin/main

          PUSHED=0

          for ATTEMPT in 1 2 3 4 5; do

            if git push origin main:main; then
              PUSHED=1
              break
            fi

            git fetch origin main

            git rebase origin/main

            sleep 2

          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "ERROR: Final push failed after 5 attempts."
            exit 1
          fi

          echo "Final changes pushed successfully."

          if [ "${#RELEASE_ASSETS[@]}" -gt 0 ]; then

            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

              gh release upload \
                "$RELEASE_TAG" \
                "${RELEASE_ASSETS[@]}" \
                --clobber

              gh release edit \
                "$RELEASE_TAG" \
                --title "$RELEASE_TITLE" \
                --target "$(git rev-parse HEAD)"

              echo "Final GitHub Release updated."

            else

              gh release create \
                "$RELEASE_TAG" \
                "${RELEASE_ASSETS[@]}" \
                --target "$(git rev-parse HEAD)" \
                --title "$RELEASE_TITLE" \
                --generate-notes

              echo "Final GitHub Release created."

            fi

          fi

      - name: Stop OpenCode
        if: always()
        run: |
          if [ -f /tmp/opencode.pid ]; then
            kill "$(cat /tmp/opencode.pid)" 2>/dev/null || true
          fi

          pkill -f "opencode web" 2>/dev/null || true

      - name: Stop Cloudflare Tunnel
        if: always()
        run: |
          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "===== OpenCode Log ====="
          cat /tmp/opencode.log 2>/dev/null || true

          echo "===== Cloudflare Log ====="
          cat /tmp/cloudflared.log 2>/dev/null || true
