name: Reset Main to d2121be

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Replace main with d2121be
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin d2121bef9c326ebe57d482fa3be2844349341b61

          git rm -rf .
          git clean -fdx

          git archive d2121bef9c326ebe57d482fa3be2844349341b61 | tar -x

          git add -A
          git commit -m "Reset main to d2121be" || true
          git push origin HEAD:main
