name: Sync from Hugging Face Bucket

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Hugging Face CLI
        run: |
          pip install -U huggingface_hub

      - name: Sync from Hugging Face Bucket
        run: |
          hf sync hf://buckets/kswarrior/opencode-storage/ks-panel ./hf_temp \
            --exclude "*node_modules*"

      - name: Remove unwanted files
        run: |
          find ./hf_temp -type d -name "node_modules" -prune -exec rm -rf {} +
          rm -rf ./hf_temp/.github

      - name: Sync Files to Repository Root
        run: |
          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            hf_temp/ ./

          rm -rf hf_temp

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Sync from Hugging Face ks-panel"
            git push origin HEAD
          fi
