name: Reset Main Files to 3ecba62

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Replace main files from 3ecba62
        env:
          TARGET: 3ecba6246567e48bb270d02d3677fc10ada17055
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$TARGET"

          echo "Removing current repository files except workflows..."

          git ls-files \
            | grep -v '^\.github/workflows/' \
            | while IFS= read -r file; do
                git rm -f -- "$file"
              done

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          mkdir -p .github

          echo "Extracting normal files from $TARGET..."

          git archive "$TARGET" \
            -- \
            . \
            ':(exclude).github/workflows' \
            | tar -x

          echo "Removing any workflow files copied from target..."

          rm -rf .github/workflows

          git checkout HEAD -- .github/workflows 2>/dev/null || true

          echo "Adding files..."
          git add -A

          echo "Checking workflow files..."
          git status --short

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Restore repository files from d2121be"

          git push origin main:main
