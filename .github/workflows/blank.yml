name: Reset Main to d2121be

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset main to d2121be
        env:
          TARGET_COMMIT: d2121bef9c326ebe57d482fa3be2844349341b61
        run: |
          git fetch origin "$TARGET_COMMIT"

          git cat-file -e "$TARGET_COMMIT^{commit}"

          git push --force origin "$TARGET_COMMIT:refs/heads/main"
