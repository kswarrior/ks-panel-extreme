name: KS Panel & Edge Release

on:
  push:
    branches:
      - main
    paths:
      - "release/kspanel"
      - "release/ksedge"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          TAG="ks-panel-edge"
          NAME="KS Panel & Edge"

          echo "Checking release..."

          RELEASE_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/releases/tags/$TAG" \
            --jq '.id' 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "Release does not exist. Creating it..."

            RELEASE_ID=$(gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f name="$NAME" \
              -f body="Latest KS Panel and KS Edge builds." \
              -F draft=false \
              -F prerelease=false \
              --jq '.id')

            echo "Created release ID: $RELEASE_ID"
          else
            echo "Release already exists: $RELEASE_ID"

            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/releases/$RELEASE_ID" \
              -f name="$NAME" \
              -f body="Latest KS Panel and KS Edge builds." \
              -F draft=false \
              -F prerelease=false >/dev/null
          fi

          echo "Uploading KS Panel..."

          if [ -f "release/kspanel" ]; then
            gh release upload "$TAG" \
              "release/kspanel#kspanel" \
              --clobber
          else
            echo "KS Panel file not found: release/kspanel"
          fi

          echo "Uploading KS Edge..."

          if [ -f "release/ksedge" ]; then
            gh release upload "$TAG" \
              "release/ksedge#ksedge" \
              --clobber
          else
            echo "KS Edge file not found: release/ksedge"
          fi

          echo "Final release information:"
          gh release view "$TAG"

          echo "KS Panel & Edge release successfully published."
