name: KS Panel & Edge Release

on:
  push:
    branches:
      - main
    paths:
      - "release/kspanel"
      - "release/ksedge"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          TAG="ks-panel-edge"
          TITLE="KS Panel & Edge"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release: $TITLE"

            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "Latest KS Panel and KS Edge releases."
          else
            echo "Release already exists. Updating assets."
          fi

          if [ -f "release/kspanel" ]; then
            echo "Uploading KS Panel..."

            cp "release/kspanel" "kspanel"

            gh release upload "$TAG" \
              "kspanel#kspanel" \
              --clobber
          fi

          if [ -f "release/ksedge" ]; then
            echo "Uploading KS Edge..."

            cp "release/ksedge" "ksedge"

            gh release upload "$TAG" \
              "ksedge#ksedge" \
              --clobber
          fi

          echo "KS Panel & Edge release updated successfully."
